<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="author" content="Larry-awa">
    <title>Larry 的工作台</title>
    <style>
        :root {
            --bg-base: #0a0a0a;
            --card-bg: rgba(20, 20, 20, 0.65);
            --card-border: rgba(255, 215, 0, 0.25);
            --text-main: #f0f0f0;
            --text-sub: #888;
            --gold-accent: #d4af37;
            --shadow-gold: 0 8px 30px rgba(212, 175, 55, 0.10);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background: var(--bg-base); color: var(--text-main);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            padding: 20px; position: relative; overflow-x: hidden;
        }

        /* 1. 黑色幕布 + 侧边黑金光晕 */
        .bg-black-mist {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(135deg, transparent 40%, rgba(212,175,55,0.02) 50%, transparent 60%);
            animation: mistSlide 30s linear infinite; z-index: -2;
        }
        @keyframes mistSlide {
            0% { transform: translate(-20%, -10%) rotate(0deg); }
            100% { transform: translate(20%, 10%) rotate(5deg); }
        }
        .bg-side-glow {
            position: fixed; top: 0; right: 0; width: 40%; height: 100%;
            background: radial-gradient(circle at 80% 50%, rgba(212,175,55,0.08), transparent 70%);
            z-index: -1; pointer-events: none;
        }

        .container { max-width: 800px; width: 100%; position: relative; z-index: 1; padding-bottom: 20px; }

        /* 2. 顶部标题与时间栏 */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0 30px; flex-wrap: wrap; gap: 12px;
        }
        .top-bar .title-area h1 { font-size: 24px; font-weight: 500; letter-spacing: 1px; color: #fff; }
        .top-bar .title-area .signature { font-family: 'Georgia', serif; font-style: italic; font-size: 14px; color: var(--gold-accent); margin-top: 2px; }
        
        /* 悬浮切换农历胶囊 */
        .date-capsule {
            background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 8px 18px; border-radius: 40px; font-size: 14px;
            cursor: pointer; transition: 0.3s; color: var(--text-sub);
            backdrop-filter: blur(4px);
        }
        .date-capsule:hover { color: #fff; border-color: var(--gold-accent); box-shadow: var(--shadow-gold); }
        .date-capsule .lunar-date { display: none; }
        .date-capsule.show-lunar .solar-date { display: none; }
        .date-capsule.show-lunar .lunar-date { display: inline; }

        /* 3. MacOS 仪表盘网格排版 */
        .grid-layout {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }

        .widget-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 20px; padding: 20px; backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .widget-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-gold); border-color: var(--gold-accent); }
        .widget-card .title { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        /* 卡片内容堆叠样式 */
        .card-content { position: relative; z-index: 2; }
        .card-bg-anim { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.15; }

        /* 4. 各种卡片背景与动效 */
        /* 密码卡片：黑客帝国背景 */
        .matrix-bg { font-size: 10px; line-height: 12px; letter-spacing: 2px; color: #00ff41; opacity: 0.2; overflow: hidden; }
        .matrix-col { position: absolute; top: -100%; animation: matrixFall 15s linear infinite; }
        @keyframes matrixFall { 0% { top: -20%; } 100% { top: 100%; } }

        /* 骰子卡片：3D 掷骰子 */
        .dice-box { width: 60px; height: 60px; margin: 0 auto; transform-style: preserve-3d; transition: transform 1s ease-out; }
        .dice-box.rolling { animation: diceRoll3D 1.2s cubic-bezier(0.25, 1, 0.5, 1); }
        @keyframes diceRoll3D {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(720deg) rotateY(720deg) rotateZ(360deg); }
        }
        .dice-face { position: absolute; width: 60px; height: 60px; background: #222; border: 1px solid #555; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #fff; backface-visibility: hidden; }
        .dice-1 { transform: translateZ(30px); } .dice-6 { transform: rotateY(180deg) translateZ(30px); }
        .dice-2 { transform: rotateX(90deg) translateZ(30px); } .dice-5 { transform: rotateX(-90deg) translateZ(30px); }
        .dice-3 { transform: rotateY(90deg) translateZ(30px); } .dice-4 { transform: rotateY(-90deg) translateZ(30px); }

        /* 随机数卡片：老虎机滚动 */
        .slot-machine-num { font-size: 48px; font-weight: bold; text-align: center; color: var(--gold-accent); transition: transform 0.1s; }
        .slot-machine-num.rolling { animation: slotSpin 0.1s ease infinite; }
        @keyframes slotSpin { 0% { transform: scale(1) translateY(0); } 100% { transform: scale(0.8) translateY(20px); } }

        /* 5. 金句卡片（多语言，点击换句） */
        .quote-text { font-size: 20px; font-style: italic; text-align: center; cursor: pointer; line-height: 1.6; margin: 12px 0; color: #fff; transition: 0.3s; }
        .quote-text:hover { color: var(--gold-accent); }
        .quote-trans { font-size: 12px; text-align: center; color: var(--text-sub); margin-top: 4px; letter-spacing: 1px; }
        .quote-lang { font-size: 10px; text-align: center; color: #666; margin-top: 8px; }

        /* 深色模式浅色替换 */
        .light-mode { --bg-base: #f5f5f5; --card-bg: rgba(255,255,255,0.8); --card-border: rgba(0,0,0,0.1); --text-main: #222; --text-sub: #888; --shadow-gold: 0 8px 20px rgba(0,0,0,0.06); }
        .light-mode .widget-card .title { color: #111; }
        .light-mode .bg-black-mist { background: rgba(0,0,0,0.02); }
        .light-mode .bg-side-glow { background: rgba(0,0,0,0.02); }

        /* 右下角深色开关 */
        .theme-toggle {
            position: fixed; right: 20px; bottom: 40px;
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 40px; padding: 10px 14px; cursor: pointer;
            backdrop-filter: blur(8px); z-index: 99; transition: 0.3s;
        }
        .theme-toggle:hover { box-shadow: var(--shadow-gold); }

        @media (max-width: 480px) {
            .grid-layout { grid-template-columns: 1fr; }
            .top-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="bg-black-mist"></div>
<div class="bg-side-glow"></div>

<div class="container">
    <!-- 顶部导航 -->
    <div class="top-bar">
        <div class="title-area">
            <h1>Larry 的工作台</h1>
            <div class="signature">— Larry Orion Nereus</div>
        </div>
        <!-- 悬浮切换农历的胶囊 -->
        <div class="date-capsule" id="dateCapsule" onclick="toggleCalendar()">
            <span class="solar-date" id="solarDate">加载中...</span>
            <span class="lunar-date" id="lunarDate">加载中...</span>
        </div>
    </div>

    <!-- 主卡片网格 -->
    <div class="grid-layout" id="appGrid">
        
        <!-- 1. 问卷与表单库 -->
        <div class="widget-card" onclick="openSurvey()" style="cursor:pointer;">
            <div class="card-content" style="display:flex; justify-content:space-between; align-items:center;">
                <div><div class="title">📁 问卷与表单库</div><div style="font-size:12px;color:var(--text-sub);">双面默契问卷</div></div>
                <span style="color:var(--gold-accent);font-size:18px;">›</span>
            </div>
        </div>

        <!-- 2. 图片调色盘 -->
        <div class="widget-card">
            <div class="card-content">
                <div class="title">🎨 图片调色</div>
                <input type="file" id="imgInput" style="width:100%;margin-bottom:8px;font-size:12px;color:var(--text-sub);background:transparent;border:none;">
                <div id="imgPreview" style="width:100%;height:100px;background:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-sub);">上传图片</div>
            </div>
        </div>

        <!-- 3. 备忘录 -->
        <div class="widget-card">
            <div class="card-content">
                <div class="title">📝 备忘录</div>
                <textarea id="memoText" style="width:100%;height:80px;background:transparent;border:none;color:var(--text-main);font-size:13px;resize:none;outline:none;" placeholder="记录灵感..."></textarea>
            </div>
        </div>

        <!-- 4. 待办清单 -->
        <div class="widget-card">
            <div class="card-content">
                <div class="title">✅ 待办清单</div>
                <div style="display:flex;gap:4px;margin-bottom:8px;"><input id="todoInput" placeholder="待办..." style="flex:1;padding:6px;background:transparent;border:1px solid var(--card-border);border-radius:12px;color:var(--text-main);font-size:12px;outline:none;"><button onclick="addTodo()" style="background:var(--gold-accent);color:#000;border:none;border-radius:12px;padding:6px 12px;font-size:12px;">+</button></div>
                <div id="todoList" style="font-size:13px;color:var(--text-sub);"></div>
            </div>
        </div>

        <!-- 5. 密码生成器（黑客帝国背景） -->
        <div class="widget-card" id="matrixCard">
            <div class="card-bg-anim matrix-bg" id="matrixBg"></div>
            <div class="card-content">
                <div class="title">🔐 密码生成</div>
                <div id="pwdDisplay" style="font-size:18px;letter-spacing:2px;text-align:center;padding:8px 0;background:rgba(0,0,0,0.3);border-radius:8px;">P@ssw0rd</div>
                <div style="display:flex;gap:8px;margin-top:8px;">
                    <button onclick="genPwd()" style="flex:1;background:var(--gold-accent);color:#000;border:none;border-radius:12px;padding:4px 0;font-size:12px;">刷新</button>
                    <button onclick="copyPwd()" style="flex:1;background:transparent;border:1px solid var(--card-border);color:var(--text-main);border-radius:12px;padding:4px 0;font-size:12px;">复制</button>
                </div>
            </div>
        </div>

        <!-- 6. 计算器 -->
        <div class="widget-card">
            <div class="card-content">
                <div class="title">🧮 计算器</div>
                <div id="calcScreen" style="text-align:right;font-size:24px;padding:4px 0;border-bottom:1px solid var(--card-border);margin-bottom:8px;min-height:32px;">0</div>
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;">
                    <button class="calc-btn" onclick="calcInput('C')">C</button><button class="calc-btn" onclick="calcInput('±')">±</button><button class="calc-btn" onclick="calcInput('%')">%</button><button class="calc-btn" onclick="calcInput('/')">÷</button>
                    <button class="calc-btn" onclick="calcInput('7')">7</button><button class="calc-btn" onclick="calcInput('8')">8</button><button class="calc-btn" onclick="calcInput('9')">9</button><button class="calc-btn" onclick="calcInput('*')">×</button>
                    <button class="calc-btn" onclick="calcInput('4')">4</button><button class="calc-btn" onclick="calcInput('5')">5</button><button class="calc-btn" onclick="calcInput('6')">6</button><button class="calc-btn" onclick="calcInput('-')">-</button>
                    <button class="calc-btn" onclick="calcInput('1')">1</button><button class="calc-btn" onclick="calcInput('2')">2</button><button class="calc-btn" onclick="calcInput('3')">3</button><button class="calc-btn" onclick="calcInput('+')">+</button>
                    <button style="grid-column:span 2;" class="calc-btn" onclick="calcInput('0')">0</button><button class="calc-btn" onclick="calcInput('.')">.</button><button class="calc-btn" style="background:var(--gold-accent);color:#000;" onclick="calcInput('=')">=</button>
                </div>
            </div>
        </div>

        <!-- 7. 单位换算 -->
        <div class="widget-card">
            <div class="card-content">
                <div class="title">📏 单位换算</div>
                <div style="display:flex;gap:4px;font-size:12px;flex-wrap:wrap;">
                    <select id="unitType" style="flex:1;background:transparent;border:1px solid var(--card-border);border-radius:8px;color:var(--text-main);padding:4px;" onchange="updateUnitOptions()"><option value="length">长度</option><option value="weight">重量</option><option value="temp">温度</option><option value="volume">体积</option></select>
                    <input type="number" id="unitVal" placeholder="数值" style="flex:1;background:transparent;border:1px solid var(--card-border);border-radius:8px;color:var(--text-main);padding:4px;width:40px;">
                </div>
                <div style="display:flex;gap:4px;margin-top:4px;font-size:12px;">
                    <select id="unitFrom" style="flex:1;background:transparent;border:1px solid var(--card-border);border-radius:8px;color:var(--text-main);"></select>
                    <span style="color:var(--text-sub);">→</span>
                    <select id="unitTo" style="flex:1;background:transparent;border:1px solid var(--card-border);border-radius:8px;color:var(--text-main);"></select>
                    <button onclick="convertUnit()" style="background:var(--gold-accent);color:#000;border:none;border-radius:8px;padding:0 12px;">=</button>
                </div>
                <div id="unitResult" style="margin-top:6px;font-size:12px;text-align:center;color:var(--text-sub);"></div>
            </div>
        </div>

        <!-- 8. 灵魂文案生成器（中英俄） -->
        <div class="widget-card">
            <div class="card-content" style="text-align:center;">
                <div class="title" style="justify-content:center;">💡 灵魂文案</div>
                <div id="quoteBox" onclick="nextQuote()" style="cursor:pointer;">
                    <div id="quoteText" class="quote-text">触碰以获取灵感</div>
                    <div id="quoteTrans" class="quote-trans">---</div>
                    <div id="quoteLang" class="quote-lang">🌐</div>
                </div>
            </div>
        </div>

        <!-- 9. 实用小工具 -->
        <div class="widget-card">
            <div class="card-content" style="display:flex;flex-direction:column;">
                <div class="title">🎲 小工具</div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;height:100%;">
                    <!-- 3D 骰子 -->
                    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--card-border);border-radius:12px;padding:8px;">
                        <div class="dice-box" id="diceBox" onclick="rollDice(this)">
                            <div class="dice-face dice-1">⚀</div><div class="dice-face dice-6">⚅</div>
                            <div class="dice-face dice-2">⚁</div><div class="dice-face dice-5">⚄</div>
                            <div class="dice-face dice-3">⚂</div><div class="dice-face dice-4">⚃</div>
                        </div>
                        <div style="font-size:10px;color:var(--text-sub);margin-top:4px;">点击掷骰</div>
                    </div>
                    <!-- 滚动随机数 -->
                    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--card-border);border-radius:12px;padding:8px;cursor:pointer;" onclick="rollRandom()">
                        <div class="slot-machine-num" id="randomNumDisplay">0</div>
                        <div style="font-size:10px;color:var(--text-sub);margin-top:4px;">点击随机</div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    
    <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀️</div>
</div>

<script>
    // 全局变量初始化
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        document.getElementById('themeToggle').innerText = document.body.classList.contains('light-mode') ? '🌙' : '☀️';
    }

    // 1. 阴历/阳历切换（悬浮模拟）
    const lunarMap = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '腊'];
    function getLunarDate() {
        const d = new Date(); const year = d.getFullYear(); const month = d.getMonth(); const day = d.getDate();
        // 简化农历算法（真实年份需查表，此处用模拟感的高级占位）
        // 真实情况需要引入庞大的农历库，为了单页代码纯净，这里用近似模拟让UI运转
        const lunYear = '丙午'; // 简化的固定占位，用于视觉展示
        const lunMonth = lunarMap[month % 12] + '月';
        const lunDay = (day % 30 === 0 ? '三十' : ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'][day % 30]);
        return `${lunYear}年 ${lunMonth} ${lunDay}`;
    }
    function updateDate() {
        const d = new Date();
        document.getElementById('solarDate').innerText = `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
        document.getElementById('lunarDate').innerText = getLunarDate();
    }
    let isLunar = false;
    function toggleCalendar() {
        isLunar = !isLunar;
        document.getElementById('dateCapsule').classList.toggle('show-lunar', isLunar);
    }
    updateDate(); setInterval(updateDate, 60000);

    // 2. 黑客帝国背景（密码卡）
    function initMatrix() {
        const bg = document.getElementById('matrixBg');
        for(let i=0; i<8; i++) {
            const col = document.createElement('div'); col.className = 'matrix-col';
            col.style.left = Math.random() * 90 + '%';
            col.style.animationDelay = (Math.random()*5)+'s';
            col.style.animationDuration = (5+Math.random()*5)+'s';
            let txt=''; for(let j=0; j<20; j++) txt += Math.random()>0.5?'0':'1' + '<br>';
            col.innerHTML = txt;
            bg.appendChild(col);
        }
    }
    initMatrix();

    // 3. 密码生成器
    function genPwd() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
        let pwd = ''; for(let i=0; i<14; i++) pwd += chars[Math.floor(Math.random()*chars.length)];
        document.getElementById('pwdDisplay').innerText = pwd;
    }
    function copyPwd() { const t = document.getElementById('pwdDisplay').innerText; navigator.clipboard?.writeText(t).then(()=>alert('已复制')); }

    // 4. 计算器
    let calcStr = '0';
    function calcInput(v) {
        const s = document.getElementById('calcScreen');
        if(v==='C') calcStr='0'; else if(v==='±') calcStr = calcStr.startsWith('-')?calcStr.slice(1):'-'+calcStr;
        else if(v==='%') calcStr = (parseFloat(eval(calcStr))/100).toString();
        else if(v==='=') { try{ calcStr = eval(calcStr.replace('×','*').replace('÷','/')).toString(); }catch(e){calcStr='Error';} }
        else { if(calcStr==='0'&&v!=='.') calcStr=v; else calcStr+=v; }
        s.innerText = calcStr;
    }

    // 5. 单位换算
    const unitData = { length: { m:1, km:1000, cm:0.01, mm:0.001 }, weight: { kg:1, g:0.001, lb:0.453592 }, temp: { C:1, F:1.8, K:1 }, volume:{ L:1, ml:0.001, gal:3.785 } };
    function updateUnitOptions() {
        const t = document.getElementById('unitType').value; const k = Object.keys(unitData[t]);
        const f = document.getElementById('unitFrom'), to = document.getElementById('unitTo');
        f.innerHTML = to.innerHTML = k.map(k=>`<option value="${k}">${k}</option>`).join('');
        to.value = k[1];
    }
    function convertUnit() {
        const t = document.getElementById('unitType').value, v = parseFloat(document.getElementById('unitVal').value);
        const f = document.getElementById('unitFrom').value, to = document.getElementById('unitTo').value;
        if(isNaN(v)) return;
        if(t==='temp') {
            let c = f==='C'?v:f==='F'?(v-32)*5/9:v-273.15;
            let r = to==='C'?c:to==='F'?c*9/5+32:c+273.15;
            document.getElementById('unitResult').innerText = `${v}${f} = ${r.toFixed(1)}${to}`;
        } else {
            document.getElementById('unitResult').innerText = `${v}${f} = ${(v*unitData[t][f]/unitData[t][to]).toFixed(3)}${to}`;
        }
    }
    updateUnitOptions();

    // 6. 3D 骰子
    function rollDice(el) {
        el.classList.remove('rolling'); void el.offsetWidth; el.classList.add('rolling');
        setTimeout(() => { el.classList.remove('rolling'); }, 1500);
    }

    // 7. 老虎机随机数
    function rollRandom() {
        const el = document.getElementById('randomNumDisplay'); el.classList.add('rolling');
        let count=0; const interval = setInterval(() => {
            el.innerText = Math.floor(Math.random()*100);
            count++; if(count>10) { clearInterval(interval); el.classList.remove('rolling'); }
        }, 50);
    }

    // 8. 多语言金句（中英俄）
    const quotePool = [
        { text: "The world is quiet here.", trans: "世界在这里变得安静。", lang: "EN" },
        { text: "Привет, мир.", trans: "你好，世界。", lang: "RU" },
        { text: "生活是一首诗，你是韵脚。", trans: "Life is a poem, and you are the rhyme.", lang: "CN" },
        { text: "Stay hungry, stay foolish.", trans: "求知若饥，虚心若愚。", lang: "EN" },
        { text: "Это не конец.", trans: "这不是结局。", lang: "RU" },
        { text: "雨停的时候，天就亮了。", trans: "When the rain stops, the sky clears.", lang: "CN" },
        { text: "To be or not to be, that is the question.", trans: "生存还是毁灭，这是一个问题。", lang: "EN" },
        { text: "Счастье внутри нас.", trans: "幸福存在于我们内心。", lang: "RU" },
        { text: "极简的背后，是万无一失的克制。", trans: "Behind minimalism lies flawless restraint.", lang: "CN" },
        { text: "The only way to do great work is to love what you do.", trans: "成就伟业的唯一途径是热爱你所做的事。", lang: "EN" },
        { text: "Тишина — золото.", trans: "沉默是金。", lang: "RU" },
        { text: "未来已来，只是分布不均。", trans: "The future is already here — it's just not evenly distributed.", lang: "CN" }
    ];
    let curQuoteIdx = -1;
    function nextQuote() {
        let idx; do { idx = Math.floor(Math.random()*quotePool.length); } while(idx === curQuoteIdx && quotePool.length > 1);
        curQuoteIdx = idx; const q = quotePool[idx];
        document.getElementById('quoteText').innerText = q.text;
        document.getElementById('quoteTrans').innerText = q.trans;
        document.getElementById('quoteLang').innerText = `[ ${q.lang} ]`;
    }
    nextQuote();

    // 9. 图片调色
    document.getElementById('imgInput').addEventListener('change', (e) => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image(); img.onload = () => {
                const canvas = document.createElement('canvas'); canvas.width=img.width; canvas.height=img.height;
                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0);
                document.getElementById('imgPreview').innerHTML = ''; document.getElementById('imgPreview').appendChild(canvas);
            }; img.src = ev.target.result;
        }; reader.readAsDataURL(file);
    });

    // 10. 备忘录（本地存储）
    document.getElementById('memoText').value = localStorage.getItem('larryMemo') || '';
    document.getElementById('memoText').addEventListener('input', function() { localStorage.setItem('larryMemo', this.value); });

    // 11. 待办清单
    function loadTodos() {
        const d = JSON.parse(localStorage.getItem('larryTodos') || '[]');
        document.getElementById('todoList').innerHTML = d.map((t,i) => `<div style="display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--card-border);"><span onclick="toggleTodo(${i})" style="flex:1;text-decoration:${t.done?'line-through':'none'};cursor:pointer;color:${t.done?'var(--text-sub)':'var(--text-main)'};">${t.text}</span><span onclick="deleteTodo(${i})" style="cursor:pointer;color:var(--text-sub);">✕</span></div>`).join('');
    }
    function saveTodos(d) { localStorage.setItem('larryTodos', JSON.stringify(d)); loadTodos(); }
    function addTodo() { const i = document.getElementById('todoInput'); if(!i.value) return; const d = JSON.parse(localStorage.getItem('larryTodos')||'[]'); d.push({text:i.value,done:false}); saveTodos(d); i.value=''; }
    function toggleTodo(i) { const d = JSON.parse(localStorage.getItem('larryTodos')||'[]'); d[i].done = !d[i].done; saveTodos(d); }
    function deleteTodo(i) { const d = JSON.parse(localStorage.getItem('larryTodos')||'[]'); d.splice(i,1); saveTodos(d); }
    loadTodos();

    // 12. 打开问卷指引
    function openSurvey() {
        if(confirm('跳转到独立问卷页面？\n后续可追加新表单。')) {
            window.location.href = 'https://larry-awa.github.io/L/survey.html';
        }
    }

    // 样式修补（浮层按钮悬停变色）
    document.querySelectorAll('.calc-btn').forEach(b => b.style.cssText = 'background:transparent;border:1px solid var(--card-border);border-radius:8px;color:var(--text-main);padding:8px 0;cursor:pointer;');
    document.querySelectorAll('.calc-btn').forEach(b => b.addEventListener('mouseover', function(){this.style.background='var(--gold-accent)';this.style.color='#000';}));
    document.querySelectorAll('.calc-btn').forEach(b => b.addEventListener('mouseout', function(){this.style.background='transparent';this.style.color='var(--text-main)';}));
</script>
</body>
</html>
