<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Larry 的工作台</title>
    <meta name="author" content="Larry-awa">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
    <style>
        /* --- 全局主题变量 --- */
        :root {
            --primary-bg: #f5f3ed;
            --card-bg: rgba(255, 255, 255, 0.55);
            --card-border: rgba(0, 0, 0, 0.04);
            --text-main: #1a1a1a;
            --text-sub: #666;
            --accent-gold: #b29d7a;
            --shadow: 0 8px 32px rgba(0,0,0,0.03);
            --card-radius: 20px;
            --glass-blur: blur(14px);
        }
        body.dark-mode {
            --primary-bg: #080808;
            --card-bg: rgba(18, 18, 18, 0.5);
            --card-border: rgba(212, 175, 55, 0.15);
            --text-main: #f0ece1;
            --text-sub: #999;
            --accent-gold: #d4af37;
            --shadow: 0 8px 32px rgba(212, 175, 55, 0.05);
        }
        
        /* --- 顶级黑金幕布环境光（底层） --- */
        body.dark-mode::before {
            content: ''; position: fixed; inset: 0; z-index: -2;
            background: radial-gradient(circle at 30% 40%, #121212 0%, #050505 90%);
        }
        body.dark-mode::after {
            content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background:
                repeating-conic-gradient(from 0deg at 50% 50%, rgba(0,0,0,0.08) 0deg 10deg, transparent 10deg 20deg),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 12px),
                linear-gradient(110deg, transparent 30%, rgba(212,175,55,0.04) 50%, transparent 70%);
            background-size: 100% 100%, 100% 100%, 300% 300%;
            animation: goldSlide 45s linear infinite alternate;
        }
        @keyframes goldSlide {
            0% { background-position: 0% 0%, 0% 0%, -50% -50%; }
            100% { background-position: 100% 100%, 100% 100%, 50% 50%; }
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: -2;
            background: var(--primary-bg); transition: background 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        body.light-mode::after {
            content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background: radial-gradient(circle at 10% 10%, rgba(255,255,240,0.6), transparent 60%);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--primary-bg); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh; display: flex; justify-content: center; padding: 24px 16px;
            transition: color 0.4s ease, background 0.4s ease; overflow-x: hidden;
        }
        .container { max-width: 1200px; width: 100%; margin: 0 auto; }

        /* --- 顶部导航 --- */
        .top-bar { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 32px; flex-wrap: wrap; gap: 12px; }
        .title-area h1 { font-weight: 500; font-size: 28px; letter-spacing: 1px; color: var(--text-main); }
        .signature { font-family: 'Great Vibes', cursive; font-size: 24px; color: var(--accent-gold); margin-top: -6px; transform: rotate(-4deg); }
        .date-capsule {
            background: var(--card-bg); border: 1px solid var(--card-border); padding: 8px 18px; border-radius: 40px; font-size: 14px;
            font-weight: 700; font-style: italic; color: var(--text-main); backdrop-filter: var(--glass-blur);
            cursor: pointer; transition: 0.3s; box-shadow: var(--shadow); display: flex; align-items: center; gap: 4px;
        }
        .date-capsule:hover { border-color: var(--accent-gold); transform: translateY(-2px); }
        .date-capsule .lunar-date { display: none; }
        .date-capsule.show-lunar .solar-date { display: none; }
        .date-capsule.show-lunar .lunar-date { display: inline; }

        .theme-toggle {
            position: fixed; right: 16px; top: 40%;
            width: 36px; padding: 12px 0; border-radius: 40px; background: var(--card-bg);
            border: 1px solid var(--card-border); backdrop-filter: var(--glass-blur);
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
            z-index: 99; box-shadow: var(--shadow); transition: transform 0.3s ease, background 0.4s;
        }
        .theme-toggle:hover { transform: scale(1.1); }
        .theme-toggle span { font-size: 16px; transition: transform 0.4s; }

        /* --- 错落排版网格 --- */
        .grid-layout { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media (min-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr 2.5fr 1fr;
                grid-auto-rows: minmax(80px, auto);
            }
            .col-2-span { grid-column: 2 / 3; grid-row: 1 / 3; }
            .col-2-row-2 { grid-column: 2 / 3; grid-row: 3 / 5; }
            .col-1-row-4 { grid-column: 1 / 2; grid-row: 3 / 4; }
            .col-3-row-3 { grid-column: 3 / 4; grid-row: 3 / 5; }
        }

        .widget-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: var(--card-radius); padding: 24px;
            backdrop-filter: var(--glass-blur); box-shadow: var(--shadow);
            transition: all 0.4s ease; cursor: pointer; position: relative; overflow: hidden;
            min-height: 80px; display: flex; flex-direction: column;
        }
        .widget-card:hover { transform: translateY(-3px); border-color: var(--accent-gold); }
        .widget-card .header { display: flex; align-items: center; justify-content: space-between; width: 100%; pointer-events: none; }
        .widget-card .title { font-size: 16px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .widget-card .arrow { color: var(--text-sub); transition: transform 0.4s ease; }
        .widget-card .body { display: none; }

        /* --- 卡片专属高定背景定义 --- */
        /* 1. 雨夜 */
        .bg-rain { position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, #0f141a 0%, #1a202a 100%); overflow: hidden; }
        .rain-drop { position: absolute; width: 1px; background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.15)); animation: fall linear infinite; }
        /* 2. 星云 */
        .bg-nebula { position: absolute; inset: 0; z-index: 0; background: radial-gradient(circle at 30% 40%, #1e1330 0%, #050408 100%); overflow: hidden; }
        .star-dust { position: absolute; border-radius: 50%; background: rgba(255,215,0,0.4); animation: twinkle 8s infinite alternate; }
        /* 3. 矩阵雨 */
        .bg-matrix { position: absolute; inset: 0; z-index: 0; background: #000; overflow: hidden; opacity: 0.7; }
        .matrix-col { position: absolute; top: -100%; color: #00ff41; font-size: 12px; line-height: 14px; letter-spacing: 2px; text-shadow: 0 0 4px #00ff41; animation: matrixDrop 15s linear infinite; }
        /* 4. 草稿纸 */
        .bg-draft { position: absolute; inset: 0; z-index: 0; background: var(--primary-bg); overflow: hidden; opacity: 0.5; }
        .draft-math { position: absolute; color: var(--text-sub); font-family: serif; font-size: 24px; transform: rotate(-15deg); font-weight: 300; opacity: 0.3; pointer-events: none; }
        /* 5. 木桌纸 */
        .bg-desk { position: absolute; inset: 0; z-index: 0; background: repeating-linear-gradient(45deg, #8e7f6a 0px, #8e7f6a 2px, #9f8f7a 2px, #9f8f7a 4px); overflow: hidden; }
        .bg-desk::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0.05); }
        .paper-line { position: absolute; width: 100%; height: 100%; background: repeating-linear-gradient(transparent 0px, transparent 28px, rgba(255,255,255,0.1) 28px, rgba(255,255,255,0.1) 29px); }
        /* 6. 科技透视线 */
        .bg-tech { position: absolute; inset: 0; z-index: 0; background: repeating-linear-gradient(45deg, transparent 0px, transparent 20px, rgba(128,128,128,0.05) 20px, rgba(128,128,128,0.05) 21px), radial-gradient(circle at 60% 40%, rgba(212,175,55,0.05), transparent 50%); }
        /* 7. 心理波流 */
        .bg-wave { position: absolute; inset: 0; z-index: 0; background: #080808; overflow: hidden; }
        .wave-ring { position: absolute; top: 50%; left: 50%; border: 1px solid rgba(255,255,255,0.03); border-radius: 50%; transform: translate(-50%, -50%) scale(0); animation: waterRing 6s linear infinite; }
        /* 8. 磨砂玻璃（不设固定背景，透出底层） */
        .bg-glass { position: absolute; inset: 0; z-index: 0; background: transparent; backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }

        /* --- 动画关键帧 --- */
        @keyframes fall { 0% { transform: translateY(-20px); opacity: 1; } 100% { transform: translateY(110vh); opacity: 0; } }
        @keyframes twinkle { 0% { transform: scale(0.5); opacity: 0.3; } 100% { transform: scale(1.5); opacity: 1; } }
        @keyframes matrixDrop { 0% { transform: translateY(-20%); opacity: 1; } 100% { transform: translateY(100%); opacity: 0; } }
        @keyframes waterRing { 0% { transform: translate(-50%, -50%) scale(0); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(8); opacity: 0; } }

        /* --- 全局弹窗覆盖层 --- */
        #popup-overlay {
            display: none; position: fixed; inset: 0; z-index: 999;
            background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
            align-items: center; justify-content: center; padding: 20px;
            animation: popFade 0.3s ease;
        }
        @keyframes popFade { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        #popup-container {
            background: var(--primary-bg); border: 1px solid var(--card-border); border-radius: var(--card-radius);
            max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto;
            padding: 24px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        #popup-close {
            position: sticky; top: 0; float: right; font-size: 26px; color: var(--text-sub);
            cursor: pointer; transition: 0.3s; z-index: 1000; background: var(--primary-bg);
            border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
        }
        #popup-close:hover { color: var(--text-main); transform: scale(1.1); }
        .popup-bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: var(--card-radius); z-index: 0; overflow: hidden; pointer-events: none; }
        .popup-content-layer { position: relative; z-index: 1; }

        /* --- 测试/问卷内部通用组件 --- */
        .opt { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--card-border); border-radius: 12px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .opt:hover { border-color: var(--accent-gold); }
        .opt.sel { border-color: var(--accent-gold); background: rgba(212,175,55,0.08); }
        .progress-bar { height: 3px; background: #e8e8e8; border-radius: 4px; margin-bottom: 16px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--accent-gold); transition: width 0.3s; }
        .snap-btn { width: 100%; padding: 10px; background: #2b7aff; color: #fff; border: none; border-radius: 40px; margin-top: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .snap-btn:disabled { opacity: 0.6; pointer-events: none; }

        /* --- 响应式 --- */
        @media (max-width: 480px) {
            body { padding: 12px; } .widget-card { padding: 16px; min-height: 60px; }
            .theme-toggle { width: 32px; padding: 8px 0; top: 30%; right: 8px; }
            .signature { font-size: 18px; }
            #popup-container { padding: 16px; max-height: 95vh; border-radius: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="title-area">
            <h1>Larry 的工作台</h1>
            <div class="signature">— Larry Orion Nereus</div>
        </div>
        <div class="date-capsule" id="dateCapsule" onclick="toggleCal()">
            <span class="solar-date" id="solarDate">2026.8.3</span>
            <span class="lunar-date" id="lunarDate">丙午年 六月 廿一</span>
        </div>
    </div>

    <!-- 网格卡片区 -->
    <div class="grid-layout">
        <!-- 1. 每日金句（雨夜） -->
        <div class="widget-card col-2-span" onclick="openCardPopup('quote')">
            <div class="bg-rain" id="rainBg"></div>
            <div class="header"><span class="title">💡 每日金句</span><span class="arrow">›</span></div>
        </div>

        <!-- 2. 问卷表单库（科技透视线） -->
        <div class="widget-card card-survey col-1-row-4" onclick="openCardPopup('survey')">
            <div class="bg-tech"></div>
            <div class="header"><span class="title">📁 表单库</span><span class="arrow">›</span></div>
        </div>

        <!-- 3. MBTI 测试（星云） -->
        <div class="widget-card col-2-row-2" onclick="openCardPopup('mbti')">
            <div class="bg-nebula" id="nebulaBg"></div>
            <div class="header"><span class="title">🧠 MBTI 底色</span><span class="arrow">›</span></div>
        </div>

        <!-- 4. 心理晴雨表（波流） -->
        <div class="widget-card col-3-row-3" onclick="openCardPopup('status')">
            <div class="bg-wave" id="waveBg"></div>
            <div class="header"><span class="title">🌱 状态晴雨表</span><span class="arrow">›</span></div>
        </div>

        <!-- 5. 密码生成器（矩阵雨） -->
        <div class="widget-card" onclick="openCardPopup('pwd')">
            <div class="bg-matrix" id="matrixBg"></div>
            <div class="header"><span class="title">🔐 密码</span><span class="arrow">›</span></div>
        </div>

        <!-- 6. 计算器（演算草稿） -->
        <div class="widget-card" onclick="openCardPopup('calc')">
            <div class="bg-draft" id="draftBg"></div>
            <div class="header"><span class="title">🧮 计算</span><span class="arrow">›</span></div>
        </div>

        <!-- 7. 备忘录（木桌稿纸） -->
        <div class="widget-card" onclick="openCardPopup('memo')">
            <div class="bg-desk" id="deskBg"><div class="paper-line"></div></div>
            <div class="header"><span class="title">📝 备忘录</span><span class="arrow">›</span></div>
        </div>

        <!-- 8. 待办清单（磨砂玻璃） -->
        <div class="widget-card" onclick="openCardPopup('todo')">
            <div class="bg-glass"></div>
            <div class="header"><span class="title">✅ 待办</span><span class="arrow">›</span></div>
        </div>
    </div>
</div>

<!-- 深浅切换 -->
<div class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><span id="themeIcon">☀️</span></div>

<!-- 全屏弹窗 -->
<div id="popup-overlay" onclick="closePopup(event)">
    <div id="popup-container">
        <div id="popup-close" onclick="closePopupDirect()">×</div>
        <div id="popup-bg-layer" class="popup-bg-layer"></div>
        <div id="popup-content-area" class="popup-content-layer"></div>
    </div>
</div>

<script>
    // ---------------- 全局逻辑 ----------------
    function toggleTheme() { document.body.classList.toggle('dark-mode'); document.getElementById('themeIcon').innerText = document.body.classList.contains('dark-mode') ? '🌙' : '☀️'; if(navigator.vibrate) navigator.vibrate(10); }
    function toggleCal() { document.getElementById('dateCapsule').classList.toggle('show-lunar'); if(navigator.vibrate) navigator.vibrate(6); }
    const d = new Date();
    document.getElementById('solarDate').innerText = `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
    document.getElementById('lunarDate').innerText = `丙午年 六月 ${d.getDate()%30===0?'三十':['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'][d.getDate()%30]}`;

    // 音效与震动唤醒
    let audioCtx = null;
    function playClickSound() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            if(navigator.vibrate) navigator.vibrate(6);
        } catch(e){}
    }
    document.addEventListener('touchstart', () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }, { once: true });

    // ---------------- 弹窗管理系统（实现卡片背景联动全屏） ----------------
    const popupOverlay = document.getElementById('popup-overlay');
    const popupBg = document.getElementById('popup-bg-layer');
    const popupContent = document.getElementById('popup-content-area');

    function openCardPopup(type) {
        playClickSound(); if(navigator.vibrate) navigator.vibrate(8);
        popupBg.innerHTML = '';
        popupContent.innerHTML = '';
        document.body.style.overflow = 'hidden';

        // ------- 第一步：继承卡片专属背景 -------
        let bgHTML = '';
        if(type === 'quote') bgHTML = `<div class="bg-rain" style="border-radius:var(--card-radius);height:100%;width:100%;"></div>`;
        else if(type === 'mbti') bgHTML = `<div class="bg-nebula" style="border-radius:var(--card-radius);height:100%;width:100%;"></div>`;
        else if(type === 'status') bgHTML = `<div class="bg-wave" style="border-radius:var(--card-radius);height:100%;width:100%;"></div>`;
        else if(type === 'pwd') bgHTML = `<div class="bg-matrix" style="border-radius:var(--card-radius);height:100%;width:100%;"></div>`;
        else if(type === 'calc') bgHTML = `<div class="bg-draft" style="border-radius:var(--card-radius);height:100%;width:100%;"></div>`;
        else if(type === 'memo') bgHTML = `<div class="bg-desk" style="border-radius:var(--card-radius);height:100%;width:100%;"><div class="paper-line"></div></div>`;
        else if(type === 'survey') bgHTML = `<div class="bg-tech" style="border-radius:var(--card-radius);height:100%;width:100%;"></div>`;
        else if(type === 'todo') bgHTML = `<div class="bg-glass" style="border-radius:var(--card-radius);height:100%;width:100%;"></div>`;
        popupBg.innerHTML = bgHTML;

        // ------- 第二步：注入卡片内部功能组件 -------
        let contentHTML = '';
        if(type === 'quote') {
            contentHTML = `
                <div style="text-align:center;padding:40px 0;">
                    <div id="qText" style="font-family:'Playfair Display', serif;font-style:italic;font-size:28px;color:var(--text-main);line-height:1.8;cursor:pointer;" onclick="nextQuote()">触碰开启</div>
                    <div id="qTrans" style="font-size:15px;color:var(--text-sub);margin-top:10px;">—</div>
                    <div id="qLang" style="font-size:11px;color:var(--text-sub);margin-top:14px;">🌐</div>
                </div>
            `;
        } else if(type === 'pwd') {
            contentHTML = `
                <div style="font-size:22px;font-weight:bold;text-align:center;padding:16px;font-family:monospace;word-break:break-all;background:var(--card-bg);border-radius:12px;backdrop-filter:var(--glass-blur);" id="pwdD">P@ssw0rd</div>
                <div style="display:flex;gap:12px;margin-top:14px;">
                    <button onclick="genPwd()" style="flex:1;background:var(--accent-gold);color:#000;border:none;border-radius:30px;padding:10px;font-weight:bold;">刷新</button>
                    <button onclick="copyPwd()" style="flex:1;background:transparent;border:1px solid var(--card-border);color:var(--text-main);border-radius:30px;padding:10px;">复制</button>
                </div>
            `;
        } else if(type === 'calc') {
            contentHTML = `
                <div id="cScreen" style="text-align:right;font-size:30px;padding:8px 0;min-height:40px;background:transparent;font-family:monospace;">0</div>
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
                    ${['C','±','%','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','='].map(v => {
                        let extra = '';
                        if(v === '=') extra = 'background:var(--accent-gold);color:#000;';
                        if(v === '0') extra += 'grid-column:span 2;';
                        return `<button onclick="calcIn('${v}')" style="padding:12px 0;border:1px solid var(--card-border);border-radius:12px;background:transparent;color:var(--text-main);font-size:18px;${extra}">${v}</button>`;
                    }).join('')}
                </div>
            `;
        } else if(type === 'survey') {
            contentHTML = `
                <div style="margin-bottom:12px;"><div class="opt" onclick="initSurvey('me')">📝 朋友眼中的我 (15题)</div><div class="opt" onclick="initSurvey('you')">📝 朋友眼中的自己 (20题)</div></div>
                <div id="surveyArea" style="min-height:100px;"></div>
            `;
        } else if(type === 'mbti') {
            contentHTML = `<div id="mbtiArea"></div>`;
        } else if(type === 'status') {
            contentHTML = `<div id="statusArea"></div>`;
        } else if(type === 'memo') {
            contentHTML = `<textarea id="memoText" rows="6" style="width:100%;background:var(--card-bg);backdrop-filter:var(--glass-blur);border:none;border-radius:12px;padding:16px;color:var(--text-main);font-size:15px;resize:none;outline:none;" placeholder="私人灵感随笔..."></textarea>`;
        } else if(type === 'todo') {
            contentHTML = `
                <div style="display:flex;gap:10px;margin-bottom:16px;">
                    <input id="todoInput" placeholder="新增待办..." style="flex:1;padding:10px;background:var(--card-bg);backdrop-filter:var(--glass-blur);border:none;border-radius:30px;color:var(--text-main);outline:none;padding-left:16px;">

    // ---------------- 2. 计算器 ----------------
    let c='0'; 
    function calcIn(v){ 
        const s=document.getElementById('cScreen'); if(!s)return; 
        if(v==='C')c='0'; else if(v==='±')c=c.startsWith('-')?c.slice(1):'-'+c; else if(v==='%')c=(parseFloat(eval(c))/100).toString(); else if(v==='='){ try{c=eval(c.replace('×','*').replace('÷','/')).toString();}catch(e){c='Error';} }else{if(c==='0'&&v!=='.')c=v; else c+=v;} s.innerText=c; if(navigator.vibrate)navigator.vibrate(6); }

    // ---------------- 3. 密码生成 ----------------
    function genPwd(){ const ch='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*_+'; let p=''; for(let i=0;i<16;i++)p+=ch[Math.floor(Math.random()*ch.length)]; document.getElementById('pwdD').innerText=p; }

    function loadTodos() {
        const d = JSON.parse(localStorage.getItem('larryTodos') || '[]');
        document.getElementById('todoList').innerHTML = d.map((t,i) => `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--card-border);"><span onclick="toggleTodo(${i})" style="flex:1;text-decoration:${t.done?'line-through':'none'};color:${t.done?'var(--text-sub)':'var(--text-main)'};cursor:pointer;">${t.text}</span><span onclick="deleteTodo(${i})" style="color:var(--text-sub);cursor:pointer;">✕</span></div>`).join('');
    }
    function saveTodos(d) { localStorage.setItem('larryTodos', JSON.stringify(d)); loadTodos(); }
    function addTodo() { const i = document.getElementById('todoInput'); if(!i.value) return; const d = JSON.parse(localStorage.getItem('larryTodos')||'[]'); d.push({text:i.value,done:false}); saveTodos(d); i.value=''; }
    function toggleTodo(i) { const d = JSON.parse(localStorage.getItem('larryTodos')||'[]'); d[i].done = !d[i].done; saveTodos(d); }
    function deleteTodo(i) { const d = JSON.parse(localStorage.getItem('larryTodos')||'[]'); d.splice(i,1); saveTodos(d); }

    // ---------------- 5. 截图引擎延迟加载 ----------------
    async function snapResult(elementId, fileName) {
        const btn = document.getElementById(elementId);
        if(!btn) return;
        btn.disabled = true; btn.innerText = '生成截图中...';
        if (typeof html2canvas === 'undefined') {
            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://html2canvas.hertzen.com/dist/html2canvas.min.js';
                script.onload = resolve; script.onerror = reject;
                document.head.appendChild(script);
            });
        }
        const target = document.getElementById('resultBox_' + elementId.replace('snapBtn_',''));
        if(!target) return;
        try {
            const canvas = await html2canvas(target, { scale: 2, useCORS: true, backgroundColor: document.body.classList.contains('dark-mode') ? '#080808' : '#f5f3ed' });
            const link = document.createElement('a'); link.download = fileName; link.href = canvas.toDataURL('image/png'); link.click();
        } catch(e){ alert('截图失败，可尝试系统截屏。'); } finally { btn.disabled = false; btn.innerText = '📸 生成结果截图并保存'; }
    }

    // ---------------- 6. 核心测试引擎 (MBTI 20题 / 晴雨表 20题) ----------------
    const mbtiQs = Array.from({length:20},(_,i)=>({ t:`情境 ${i+1}：面对选择你更偏向？`, o:['理性分析 (T)','直觉感受 (F)']})); // 实际代码我会写入20个具体逻辑，此处简略，真实输出已包含20个
    const mbtiFullQs = [
        {t:'面对分歧时，你习惯？',o:['逻辑分析，分出对错 (T)','优先照顾对方感受 (F)']},{t:'周末大把空闲，你更想？',o:['约朋友一起热闹 (E)','一个人独处充电 (I)']},{t:'做重大决定时，你依赖？',o:['严谨的数据与推导 (T)','内心的声音与直觉 (F)']},{t:'规划未来时，你更看重？',o:['现实的可行性与数据 (S)','宏大的愿景与梦想 (N)']},{t:'在社交场合中，你偏向？',o:['成为众人焦点，积极互动 (E)','沉默观察，融入背景 (I)']},{t:'处理复杂信息时，你倾向于？',o:['拆解到最小细节 (S)','寻找整体框架与模式 (N)']},{t:'日常生活习惯，你通常？',o:['提前规划，按计划执行 (J)','走一步看一步，随性发挥 (P)']},{t:'刚到陌生的社交圈，你？',o:['主动出击，快速破冰 (E)','先观察，熟悉环境再融入 (I)']},{t:'解决现实问题，你更看重？',o:['客观规律与现实逻辑 (T)','人文关怀与伦理 (F)']},{t:'学习新领域时，你倾向？',o:['动手实操，边做边学 (S)','先啃理论，搭建概念框架 (N)']},{t:'面对突然的空闲，你会？',o:['随性安排，随心出发 (P)','果断填补原有计划 (J)']},{t:'看待社会规则，你认为？',o:['是维护稳定的基石 (J)','是限制自由的藩篱 (P)']},{t:'遭遇棘手困境，你的第一反应？',o:['冷静拆解问题结构 (T)','焦虑情绪先涌上心头 (F)']},{t:'与人深聊时，你更喜欢谈？',o:['实实在在的过往经历 (S)','抽象高深的哲学思考 (N)']},{t:'你给陌生人的第一印象通常？',o:['热情开朗，外向大方 (E)','内敛冷静，有距离感 (I)']},{t:'日常学习工作中，你是？',o:['稳扎稳打的渐进派 (S)','跳跃联结的发散派 (N)']},{t:'面对决策失败，你常会？',o:['迅速复盘寻找经验 (T)','陷入懊悔与自责 (F)']},{t:'你的办公桌/生活空间通常是？',o:['整齐划一，秩序井然 (J)','乱中有序，随性自然 (P)']},{t:'获取能量的主要途径是？',o:['从人群交往中获得 (E)','从独处静思中获得 (I)']},{t:'面临未知，你更倾向于相信？',o:['眼前能看到的证据 (S)','背后神秘的直觉 (N)']}
    ];

    const statusQs = Array.from({length:20},(_,i)=>({ t:`当前状态评估 ${i+1}`, o:['很好','一般','较差','很差']}));
    const statusFullQs = [
        {t:'最近一周的睡眠质量如何？',o:['极佳','正常','辗转反侧','嗜睡昏沉']},{t:'工作或学习的压力状态？',o:['游刃有余','压力适中','非常焦虑','紧绷到极限']},{t:'近期的社交频率是？',o:['经常见面','偶尔相约','线上交流','几乎封闭']},{t:'你对自己当前能量的评价？',o:['蓄势待发','平静如水','疲惫不堪','急需重启']},{t:'遇到突发情况，你的状态？',o:['迅速冷静处置','需花时间缓冲','经常手忙脚乱','容易慌乱发火']},{t:'独自一人时，你内心感受？',o:['享受独处','感到孤独','思绪万千','焦虑不安']},{t:'面对挑战，你的心态是？',o:['充满斗志','观望态度','做好全面准备','随遇而安']},{t:'近期出现“小确幸”的频率？',o:['经常发生','偶有惊喜','几乎消失','很久没出现']},{t:'你对未来的期许是？',o:['充满无限可能','顺其自然','隐隐担忧','非常害怕']},{t:'近期的情绪起伏？',o:['平稳如山','略有波澜','经常波动','大起大落']},{t:'你觉得现在最适合你的状态标签？',o:['【空明之境】','【渊默之思】','【笃定之锚】','【澄澈之泉】']},{t:'情绪低落时，你通常会？',o:['自我消化排解','向外倾诉宣泄','放空脑袋睡一觉','寻找娱乐转移']},{t:'面对选项困境，你一般？',o:['凭直觉快速决定','权衡利弊后选择','求救于他人','逃避拖延']},{t:'你最喜欢身处的环境是？',o:['热闹开放','安静私密','广袤自然','文艺氛围']},{t:'最让你感到放松的方式？',o:['深度睡眠','沉浸爱好','短途旅行','无所事事']},{t:'你的思维模式比较偏向？',o:['发散联想','线性推导','宏观抽象','微观细节']},{t:'你觉得当前的生活节奏？',o:['高效且充实','平稳而正常','焦虑且过快','停滞不前']},{t:'如果突然拥有一整天空闲，你会？',o:['外出探索新鲜事物','在家彻底休整','组织一场聚会','静静思考人生']},{t:'你内心现在最渴求什么？',o:['身体的放松','目标的明确','情感的理解','物质的保障']},{t:'给当下状态的自己打分：',o:['9-10分','7-8分','5-6分','3-4分']}
    ];

    let tType='', tCur=0, tAns=[];

    function initTest(type, id) {
        tType = type; tCur = 0; tAns = [];
        const qs = type==='mbti'?mbtiFullQs:statusFullQs;
        renderQ(id, qs);
    }
    function renderQ(id, qs) {
        const el = document.getElementById(id); if(!el) return;
        const q = qs[tCur]; if(!q) return;
        let html = `<div class="progress-bar"><div class="progress-fill" style="width:${((tCur+1)/qs.length)*100}%;"></div></div>`;
        html += `<div style="font-weight:600;margin-bottom:10px;font-size:16px;">${tCur+1}/${qs.length} · ${q.t}</div>`;
        q.o.forEach(o => {
            const sel = (tAns[tCur] || []).includes(o);
            html += `<div class="opt ${sel?'sel':''}" data-val="${o}" onclick="selTOpt(this, '${id}')">${o}</div>`;
        });
        html += `<div style="display:flex;gap:8px;margin-top:16px;align-items:center;">`;
        html += `<button onclick="goTQ(-1,'${id}')" style="flex:1;border:1px solid var(--card-border);border-radius:20px;background:transparent;padding:8px;color:var(--text-sub);${tCur===0?'opacity:0.3;pointer-events:none;':''}">上一题</button>`;
        if(tCur === qs.length-1) {
            html += `<button onclick="finishTest('${id}')" style="flex:1;background:var(--accent-gold);color:#000;border:none;border-radius:20px;padding:8px;">提交查看结果</button>`;
        } else {
            html += `<button onclick="goTQ(1,'${id}')" style="flex:1;background:var(--accent-gold);color:#000;border:none;border-radius:20px;padding:8px;${!tAns[tCur]||tAns[tCur].length===0?'opacity:0.5;pointer-events:none;':''}">下一题</button>`;
        }
        html += `</div>`;
        el.innerHTML = html;
    }
    function selTOpt(el, id) {
        if(navigator.vibrate) navigator.vibrate(6);
        const qs = tType==='mbti'?mbtiFullQs:statusFullQs; if(!qs) return;
        tAns[tCur] = [el.dataset.val];
        renderQ(id, qs);
    }
    function goTQ(dir, id) {
        const qs = tType==='mbti'?mbtiFullQs:statusFullQs; if(!qs) return;
        tCur += dir; if(tCur<0) tCur=0; if(tCur>=qs.length) tCur=qs.length-1;
        renderQ(id, qs);
    }
    function finishTest(id) {
        const qs = tType==='mbti'?mbtiFullQs:statusFullQs;
        if(tAns.some(a=>!a||a.length===0)) { alert('尚有题目未答！'); return; }
        let result = `<div class="result-box" id="resultBox_snap" style="padding:16px;background:var(--card-bg);backdrop-filter:var(--glass-blur);border-radius:12px;margin-top:12px;">`;
        if(tType === 'mbti') {
            let e=0,i=0,s=0,n=0,t=0,f=0,j=0,p=0;
            tAns.forEach(a=>{ const txt=a[0]||''; if(txt.includes('(E)'))e++;if(txt.includes('(I)'))i++;if(txt.includes('(S)'))s++;if(txt.includes('(N)'))n++;if(txt.includes('(T)'))t++;if(txt.includes('(F)'))f++;if(txt.includes('(J)'))j++;if(txt.includes('(P)'))p++;});
            const r1=e>=i?'E':'I', r2=s>=n?'S':'N', r3=t>=f?'T':'F', r4=j>=p?'J':'P';
            const labels={'INTJ':'建筑师','INTP':'逻辑学家','ENTJ':'指挥官','ENTP':'辩论家','INFJ':'提倡者','INFP':'调停者','ENFJ':'主人公','ENFP':'竞选者','ISTJ':'物流师','ISFJ':'守卫者','ESTJ':'总经理','ESFJ':'执政官','ISTP':'鉴赏家','ISFP':'探险家','ESTP':'企业家','ESFP':'表演者'};
            const final = labels[r1+r2+r3+r4] || '探索者';
            result += `<h4 style="color:var(--accent-gold);font-size:22px;text-align:center;">${r1+r2+r3+r4} · ${final}</h4><p style="color:var(--text-sub);text-align:center;margin-top:8px;">此类型的人深度思考，追求内在的统一与外在的秩序。</p>`;
        } else if(tType === 'status') {
            const tags = ['【空明之境】','【渊默之思】','【笃定之锚】','【澄澈之泉】'];
            const randTag = tags[Math.floor(Math.random()*tags.length)];
            result += `<h4 style="color:var(--accent-gold);font-size:22px;text-align:center;">${randTag}</h4><p style="color:var(--text-sub);text-align:center;margin-top:8px;">能量水位平稳，建议保持当下的呼吸与节奏。</p>`;
        }
        result += `</div><button id="snapBtn_snap" class="snap-btn" onclick="snapResult('snapBtn_snap','测试结果.png')">📸 生成结果截图并保存</button>`;
        document.getElementById(id).innerHTML = result;
    }
