var MEMO_KEY = 'larryMemos';
function loadMemos(){ try { var arr = JSON.parse(localStorage.getItem(MEMO_KEY) || 'null'); if (Array.isArray(arr)) return arr; } catch(e){}
  var old = localStorage.getItem('larryMemo');
  if (old){ var d = new Date(); var id = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    var init = [{id: id + '_' + Date.now(), date: id, text: old}]; try { localStorage.setItem(MEMO_KEY, JSON.stringify(init)); } catch(e){} return init; }
  return [];
}
function saveMemos(list){ try { localStorage.setItem(MEMO_KEY, JSON.stringify(list)); } catch(e){} }
function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

function showMemoPopup(){
  var memos = loadMemos();

  function render(){
    var html = '<div class="memo-tabs" id="memoTabs"></div>' +
      '<textarea class="memo-textarea" id="memoArea" placeholder="随手写点什么..."></textarea>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">' +

        '<button class="btn-secondary" id="memoDel" style="font-size:12px;">删除本则</button>' +
      '</div>';
    popupContent.innerHTML = html;
    renderTabs();
    var active = memos.find(function(m){ return m.id === activeId; });
    var area = $('memoArea');
    area.value = active ? active.text : '';
    area.placeholder = active ? '随手写点什么...' : '点击上方"+ 新便签"创建';
    var status = $('memoStatus');
    var timer = null;
    area.addEventListener('input', function(){
      if (!active) return;
      clearTimeout(timer);
      status.textContent = '正在保存...';
      timer = setTimeout(function(){
        active.text = area.value;
        saveMemos(memos);
        status.textContent = '已保存';
      }, 500);
    });
    $('memoDel').addEventListener('click', function(){
      if (!active) return;
      if (!confirm('删除「' + active.date + '」的便签？')) return;
      var i = memos.findIndex(function(m){ return m.id === activeId; });
      if (i >= 0){ memos.splice(i, 1); saveMemos(memos); activeId = memos.length ? memos[0].id : null; render(); }
    });
  }
  function renderTabs(){
    var tabs = $('memoTabs');
    tabs.innerHTML = '';
    memos.forEach(function(m){
      var el = document.createElement('div');
      el.className = 'memo-tab' + (m.id === activeId ? ' active' : '');
      el.innerHTML = '<span>' + escapeHtml(m.date) + '</span><span class="del" data-del="' + m.id + '">×</span>';
      el.addEventListener('click', function(e){
        if (e.target.classList.contains('del')) return;
        activeId = m.id; render();
      });
      tabs.appendChild(el);
    });
    var btn = document.createElement('div');
    btn.className = 'memo-new';
    btn.textContent = '+ 新便签';
    btn.addEventListener('click', function(){
      var id = todayStr() + '_' + Date.now();
      memos.unshift({ id: id, date: todayStr(), text: '' });
      saveMemos(memos);
      activeId = id;
      render();
      setTimeout(function(){ var a = $('memoArea'); if (a) a.focus(); }, 30);
    });
    tabs.appendChild(btn);
    tabs.querySelectorAll('[data-del]').forEach(function(x){
      x.addEventListener('click', function(e){
        e.stopPropagation();
        var id = x.getAttribute('data-del');
        var m = memos.find(function(y){ return y.id === id; });
        if (!m) return;
        if (!confirm('删除「' + m.date + '」的便签？')) return;
        var i = memos.findIndex(function(y){ return y.id === id; });
        if (i >= 0){ memos.splice(i, 1); saveMemos(memos); if (activeId === id){ activeId = memos.length ? memos[0].id : null; } render(); }
      });
    });
  }
  openPopup('便签', '');
  render();
}

/* 计算器 */
var calcStr = '0';
var unitData = { length: {m:1, km:1000, cm:0.01, mm:0.001, mile:1609.344, ft:0.3048}, weight: {kg:1, g:0.001, lb:0.453592, oz:0.0283495}, temp: {C:1, F:1, K:1} };
function calcInput(v){
  if (v === 'C') calcStr = '0';
  else if (v === '±') calcStr = calcStr.charAt(0) === '-' ? calcStr.slice(1) : '-' + calcStr;
  else if (v === '='){
    try {
      var expr = calcStr
        .replace(/×/g, '*').replace(/÷/g, '/')
        .replace(/π/g, '(3.141592653589793)')
        .replace(/√/g, 'Math.sqrt')
        .replace(/\^/g, '**')
        .replace(/sin/g, 'Math.sin').replace(/cos/g, 'Math.cos').replace(/tan/g, 'Math.tan')
        .replace(/ln/g, 'Math.log').replace(/log/g, 'Math.log10');
      if (!/^[\d+\-*/().,%\sMathsqrincostalgPI0-9*]+$/.test(expr)){ calcStr = 'Error'; return; }
      var r = eval(expr);
      if (typeof r === 'number' && !isFinite(r)){ calcStr = 'Error'; return; }
      calcStr = (Math.round(r * 1e10) / 1e10).toString();
    } catch(e){ calcStr = 'Error'; }
  }
  else if (v === 'π' || v === '(' || v === ')' || v === '^') calcStr += v;
  else if (v === '√') calcStr += '√(';
  else if (v === 'sin' || v === 'cos' || v === 'tan' || v === 'ln' || v === 'log') calcStr += v + '(';
  else {
    if (calcStr === '0' && v !== '.') calcStr = v;
    else if (calcStr === 'Error') calcStr = v;
    else calcStr += v;
  }
}

  });

  function refreshUnits(){ var keys = Object.keys(unitData[typeSel.value]); fromSel.innerHTML = keys.map(function(k){ return '<option value="' + k + '">' + k + '</option>'; }).join(''); toSel.innerHTML = keys.map(function(k){ return '<option value="' + k + '">' + k + '</option>'; }).join(''); toSel.value = keys[1] || keys[0]; }
  refreshUnits();

var COUNTS_KEY = 'larryCounts';

function loadCounts(){
  try {

    if (Array.isArray(arr)) return arr;
  } catch(e){}
  // 兼容旧版单条数据，自动迁移
  var oldDate = localStorage.getItem('larryCountDate');
  var oldName = localStorage.getItem('larryCountName');
  if (oldDate && /^\d{4}-\d{2}-\d{2}$/.test(oldDate)){
    var init = [{ id: 'c' + Date.now(), name: oldName || '目标', date: oldDate }];
    try { localStorage.setItem(COUNTS_KEY, JSON.stringify(init)); } catch(e){}
    return init;
  }
  return [];
}
function saveCounts(list){ try { localStorage.setItem(COUNTS_KEY, JSON.stringify(list)); } catch(e){} }

function showCountPopup(){

  function fillDays(){
    var y = parseInt($('cdY').value, 10);

    var dStr = d < 10 ? '0' + d : '' + d;

      id: 'c' + Date.now() + '_' + Math.floor(Math.random() * 1000),
      name: n,
      date: dateStr
    });
    saveCounts(counts);
    $('countName').value = '';
    renderList();
    showToast('已添加');
  }

  function diffYMD(from, to){
    var y = to.getFullYear() - from.getFullYear();
    var m = to.getMonth() - from.getMonth();
    var d = to.getDate() - from.getDate();
    if (d < 0){
      m -= 1;
      var lastMonthDays = new Date(to.getFullYear(), to.getMonth(), 0).getDate();
      d += lastMonthDays;
    }
    if (m < 0){ y -= 1; m += 12; }
    return { y: y, m: m, d: d };
  }

  function renderYMD(obj){
    var y = obj.y, m = obj.m, d = obj.d;
    var parts = [];
    if (y > 0) parts.push('<span class="count-num">' + y + '</span><span class="count-unit">年</span>');
    if (m > 0) parts.push('<span class="count-num">' + m + '</span><span class="count-unit">月</span>');
    if (d > 0 || (y === 0 && m === 0)) parts.push('<span class="count-num">' + d + '</span><span class="count-unit">天</span>');
    return '<div class="count-result">' + parts.join('') + '</div>';
  }

  function renderList(){
    var listEl = $('countList');
    if (!counts.length){
      listEl.innerHTML = '<div class="count-empty-list">还没有纪念日，上面添加一个吧</div>';
      return;
    }
    var now = new Date();
    now.setHours(0,0,0,0);
    var html = '';
    counts.forEach(function(c){
      var m = c.date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return;
      var target = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
      var tag, body;
      if (target.getTime() > now.getTime()){
        tag = '倒计时';
        body = renderYMD(diffYMD(now, target));
      } else if (target.getTime() === now.getTime()){
        tag = '今天';
        body = '<div class="count-result"><span class="count-num" style="font-size:22px;">就 是 今 天</span></div>';
      } else {
        tag = '正计时';
        body = renderYMD(diffYMD(target, now));
      }
      var dateShow = m[1] + '.' + m[2] + '.' + m[3];
      html += '<div class="count-item">' +
        '<div class="count-item-head">' +
          '<div class="count-item-name">' + escapeHtml(c.name) + '</div>' +
          '<div class="count-item-date">' + dateShow + ' · ' + tag + '</div>' +
          '<button class="count-del" data-del="' + escapeHtml(c.id) + '" title="删除">×</button>' +
        '</div>' +
        body +
      '</div>';
    });
    listEl.innerHTML = html;

    listEl.querySelectorAll('[data-del]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var id = btn.getAttribute('data-del');
        var item = null;
        for (var i = 0; i < counts.length; i++){ if (counts[i].id === id){ item = counts[i]; break; } }
        if (!item) return;
        if (!confirm('删除「' + item.name + '」？')) return;
        counts = counts.filter(function(x){ return x.id !== id; });
        saveCounts(counts);
        renderList();
        showToast('已删除');
      });
    });
  }

  renderList();
}

/* 思维导图 */
var MIND_KEY = 'larryMindTree';
function defaultMind(){ return { root: { id:'root', text:'中心主题', children: [] } }; }
function loadMind(){
  try {
    var d = JSON.parse(localStorage.getItem(MIND_KEY) || 'null');
    if (d && d.id === 'root' && !d.root) { try { localStorage.removeItem(MIND_KEY); } catch(e){} return defaultMind(); }
    if (d && d.root && d.root.id === 'root') return d;
  } catch(e){}
  return defaultMind();
}
function saveMind(data){ try { localStorage.setItem(MIND_KEY, JSON.stringify(data)); } catch(e){} }
function removeMindNode(parent, id){
  if (!parent.children) return false;
  for (var i = 0; i < parent.children.length; i++){
    if (parent.children[i].id === id){ parent.children.splice(i, 1); return true; }
    if (removeMindNode(parent.children[i], id)) return true;
  }
  return false;
}
function measureMind(node){
  if (!node.children || node.children.length === 0){ node._w = 1; return 1; }
  var total = 0;
  node.children.forEach(function(c){ total += measureMind(c); });
  node._w = total;
  return total;
}
function layoutMind(node, xStart, xEnd, y, levelGap){
  node._x = (xStart + xEnd) / 2;
  node._y = y;
  if (!node.children || node.children.length === 0) return;
  var total = 0;
  node.children.forEach(function(c){ total += c._w; });
  var x = xStart;
  node.children.forEach(function(c){
    var w = (xEnd - xStart) * c._w / total;
    layoutMind(c, x, x + w, y + levelGap, levelGap);
    x += w;
  });
}
function showMindPopup(){
  var data = loadMind();
  var html = '<div class="mind-container" id="mindContainer"><svg class="mind-svg" id="mindSvg"></svg></div>' +
    '<div style="margin-top:14px;display:flex;gap:8px;"><button class="btn-secondary" id="mindReset" style="flex:1;">重置导图</button></div>' +
    '<div style="font-size:11px;color:var(--text-sub);margin-top:10px;text-align:center;line-height:1.7;">点击节点添加子节点 · 双击编辑文字 · 右键删除（触屏长按）</div>';
  openPopup('思维导图', html);
  var container = $('mindContainer'), svg = $('mindSvg');

  function render(){
    container.querySelectorAll('.mind-node').forEach(function(n){ n.remove(); });
    svg.innerHTML = '';
    var W = container.clientWidth || 520, H = container.clientHeight || 440;
    var maxDepth = 0;
    (function walk(n, d){ maxDepth = Math.max(maxDepth, d); if (n.children) n.children.forEach(function(c){ walk(c, d+1); }); })(data.root, 0);
    measureMind(data.root);
    var topPad = 46, botPad = 30, leftPad = 40, rightPad = 40;
    var usableH = H - topPad - botPad;
    var levelGap = maxDepth > 0 ? Math.min(90, usableH / maxDepth) : 80;
    layoutMind(data.root, leftPad, W - rightPad, topPad, levelGap);

    (function drawCurves(node){
      if (!node.children) return;
      node.children.forEach(function(c){
        var x1 = Math.round(node._x), y1 = Math.round(node._y);
        var x2 = Math.round(c._x), y2 = Math.round(c._y);
        var dy = (y2 - y1) * 0.5;
        var path = document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + (y1 + dy) + ', ' + x2 + ' ' + (y2 - dy) + ', ' + x2 + ' ' + y2);
        svg.appendChild(path);
        drawCurves(c);
      });
    })(data.root);

    (function renderNodes(node, depth){
      var el = document.createElement('div');
      el.className = 'mind-node depth-' + Math.min(depth, 3);
      el.textContent = node.text;
      el.style.left = Math.round(node._x) + 'px';
      el.style.top = Math.round(node._y) + 'px';
      container.appendChild(el);
      var clickTimer = null, touchTimer = null;
      el.addEventListener('click', function(e){
        e.stopPropagation();
        if (clickTimer) return;
        clickTimer = setTimeout(function(){
          clickTimer = null;
          var txt = prompt('新节点文字：', '新分支');
          if (txt === null || !txt.trim()) return;
          if (!node.children) node.children = [];
          node.children.push({ id: 'n' + Date.now() + '_' + Math.floor(Math.random()*10000), text: txt.trim(), children: [] });
          saveMind(data); render();
        }, 240);
      });
      el.addEventListener('dblclick', function(e){
        e.stopPropagation();
        if (clickTimer){ clearTimeout(clickTimer); clickTimer = null; }
        var txt = prompt('编辑文字：', node.text);
        if (txt === null) return;
        node.text = txt; saveMind(data); render();
      });
      el.addEventListener('contextmenu', function(e){
        e.preventDefault(); e.stopPropagation();
        if (clickTimer){ clearTimeout(clickTimer); clickTimer = null; }
        deleteNode(node);
      });
      el.addEventListener('touchstart', function(){ clearTimeout(touchTimer); touchTimer = setTimeout(function(){ touchTimer = null; deleteNode(node); }, 700); }, {passive: true});
      el.addEventListener('touchend', function(){ clearTimeout(touchTimer); touchTimer = null; });
      el.addEventListener('touchmove', function(){ clearTimeout(touchTimer); touchTimer = null; });
      if (node.children) node.children.forEach(function(c){ renderNodes(c, depth + 1); });
    })(data.root, 0);
  }
  function deleteNode(node){
    if (node.id === 'root'){ showToast('根节点不能删除'); return; }
    if (!confirm('删除「' + node.text + '」及其所有子节点？')) return;
    removeMindNode(data.root, node.id); saveMind(data); render();
  }
  function tryRender(attempt){
    void container.offsetHeight;
    var w = container.clientWidth, h = container.clientHeight;
    if (w > 0 && h > 0){ try { render(); } catch(err){ console.error('mind error:', err); } }
    else if (attempt < 20){ setTimeout(function(){ tryRender(attempt + 1); }, 50); }
    else { try { render(); } catch(err){} }
  }
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ tryRender(0); }); });
  $('mindReset').addEventListener('click', function(){
    if (!confirm('重置导图？所有内容将丢失。')) return;
    data = defaultMind(); saveMind(data); render();
  });
}

          '<input type="range" id="convQ" min="10" max="100" value="92" style="width:100%;accent-color:var(--accent);">' +
        '</div>' +
        '<button class="btn-primary" id="convGo" style="width:100%;">转换并下载</button>';

      var curFmt = 'image/jpeg';
      var curExt = 'jpg';
      popupContent.querySelectorAll('.conv-fmt').forEach(function(btn){
        btn.addEventListener('click', function(){
          popupContent.querySelectorAll('.conv-fmt').forEach(function(b){ b.style.background = ''; b.style.borderColor = ''; });
          btn.style.background = 'var(--accent-soft)';
          btn.style.borderColor = 'var(--accent)';
          curFmt = btn.getAttribute('data-fmt');
          curExt = btn.getAttribute('data-ext');

        });
      });
      popupContent.querySelectorAll('.conv-fmt')[0].click();
      $('convQ').addEventListener('input', function(){ $('convQVal').textContent = this.value; });
      $('convGo').addEventListener('click', function(){
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        if (curFmt === 'image/jpeg'){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
        ctx.drawImage(img, 0, 0);
        var q = parseInt($('convQ').value, 10) / 100;
        c.toBlob(function(blob){
          if (!blob){ showToast('转换失败'); return; }
          var newUrl = URL.createObjectURL(blob);
          var a = document.createElement('a');
          var base = (file.name || 'image').replace(/\.[^.]+$/, '');
          a.href = newUrl; a.download = base + '.' + curExt;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(newUrl); }, 1000);
          showToast('已下载 ' + curExt.toUpperCase());
        }, curFmt, q);
      });
    };
    img.onerror = function(){ showToast('图片加载失败'); };
    img.src = url;
  });
}

function showTextCase(){

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;">' +

      '<button class="btn-secondary" data-case="cap">首字母大写</button>' +
      '<button class="btn-secondary" data-case="camel">驼峰 camelCase</button>' +
      '<button class="btn-secondary" data-case="pascal">PascalCase</button>' +
      '<button class="btn-secondary" data-case="snake">下划线 snake_case</button>' +
      '<button class="btn-secondary" data-case="kebab">中划线 kebab-case</button>' +
      '<button class="btn-secondary" data-case="reverse">反转字符串</button>' +
    '</div>' +
    '<textarea class="input-field" id="tcOut" placeholder="输出..." readonly style="min-height:130px;font-family:inherit;font-size:13px;resize:vertical;"></textarea>' +
    '<button class="btn-secondary" id="tcCopy" style="width:100%;margin-top:10px;">复制结果</button>';
  openPopup('文本大小写', html);
  popupContent.querySelectorAll('[data-case]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var s = $('tcIn').value;
      var k = btn.getAttribute('data-case');
      var r = '';
      if (k === 'upper') r = s.toUpperCase();
      else if (k === 'lower') r = s.toLowerCase();
      else if (k === 'cap') r = s.replace(/\b\w/g, function(c){ return c.toUpperCase(); });
      else if (k === 'camel') r = s.trim().split(/[\s_\-]+/).map(function(w,i){ return i === 0 ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); }).join('');
      else if (k === 'pascal') r = s.trim().split(/[\s_\-]+/).map(function(w){ return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); }).join('');
      else if (k === 'snake') r = s.trim().replace(/([A-Z])/g, '_$1').replace(/[\s\-]+/g, '_').toLowerCase().replace(/^_/, '');
      else if (k === 'kebab') r = s.trim().replace(/([A-Z])/g, '-$1').replace(/[\s_]+/g, '-').toLowerCase().replace(/^-/, '');
      else if (k === 'reverse') r = s.split('').reverse().join('');
      $('tcOut').value = r;
    });
  });
  $('tcCopy').addEventListener('click', function(){ copyText($('tcOut').value); });
}

        '<div class="palette-row">' +
          '<span class="palette-label">亮度 <span class="val" id="brVal">100</span></span>' +
          '<input type="range" class="palette-slider" id="brSlider" min="0" max="200" value="100">' +
        '</div>' +
        '<div class="palette-row">' +
          '<span class="palette-label">对比度 <span class="val" id="ctVal">100</span></span>' +
          '<input type="range" class="palette-slider" id="ctSlider" min="0" max="200" value="100">' +
        '</div>' +
        '<div class="palette-row">' +
          '<span class="palette-label">饱和度 <span class="val" id="stVal">100</span></span>' +
          '<input type="range" class="palette-slider" id="stSlider" min="0" max="200" value="100">' +
        '</div>';
      var imgEl = $('paletteImg');
      function update(){
        var b = $('brSlider').value, c = $('ctSlider').value, s = $('stSlider').value;
        $('brVal').textContent = b; $('ctVal').textContent = c; $('stVal').textContent = s;
        imgEl.style.filter = 'brightness(' + b + '%) contrast(' + c + '%) saturate(' + s + '%)';
      }
      ['brSlider','ctSlider','stSlider'].forEach(function(id){ $(id).addEventListener('input', update); });
    };
    reader.readAsDataURL(file);
  });
}

/* 随机数 */
function showRandom(){
  var html = '<div style="font-size:13px;color:var(--text-sub);margin-bottom:8px;">位数（1-10 位）</div>' +
    '<div style="display:flex;gap:8px;margin-bottom:14px;">' +
      '<input type="number" class="input-field" id="randDigits" value="6" min="1" max="10" placeholder="位数">' +
      '<button class="btn-primary" id="randGen" style="flex-shrink:0;">生成</button>' +
    '</div>' +
    '<div style="text-align:center;font-size:44px;font-weight:700;color:var(--accent);margin-top:20px;font-family:Iowan Old Style,Georgia,serif;letter-spacing:2px;" id="randResult">—</div>';
  openPopup('随机数', html);
  $('randGen').addEventListener('click', function(){
    var digits = parseInt($('randDigits').value, 10);
    if (isNaN(digits) || digits < 1 || digits > 10){ showToast('请输入 1-10 之间的位数'); return; }
    var min = Math.pow(10, digits - 1), max = Math.pow(10, digits) - 1;
    if (digits === 1) min = 0;
    $('randResult').textContent = Math.floor(Math.random() * (max - min + 1)) + min;
  });
}

/* 数据备份 */
var BACKUP_KEYS = ['larryTodos','larryMemos','larryQuoteBag','larryPwdHistory','larryCounts','larryCountDate','larryCountName','larryMindTree'];

function showBackup(){
  var stat = {};
  BACKUP_KEYS.forEach(function(k){
    var v = localStorage.getItem(k);
    if (v === null){ stat[k] = 0; return; }
    try { var j = JSON.parse(v); stat[k] = Array.isArray(j) ? j.length : (typeof j === 'object' && j ? 1 : 1); }
    catch(e){ stat[k] = 1; }
  });
  var hasBg = false;
  openDB().then(function(db){
    return new Promise(function(res){
      var tx = db.transaction(STORE,'readonly');
      var req = tx.objectStore(STORE).get('userBg');
      req.onsuccess = function(){ hasBg = !!(req.result && req.result.data); res(); };
      req.onerror = function(){ res(); };
    });
  }).then(function(){
    var rows = [
      ['待办', stat.larryTodos || 0, '条'],
      ['便签', stat.larryMemos || 0, '份'],
      ['密码历史', stat.larryPwdHistory || 0, '条'],
      ['思维导图', stat.larryMindTree ? 1 : 0, '棵'],
      ['纪念日', stat.larryCounts || 0, '个'],
      ['文案袋', stat.larryQuoteBag ? 1 : 0, '组'],
      ['背景图', hasBg ? 1 : 0, '张']
    ];
    var html = '<div style="font-size:12px;color:var(--text-sub);margin-bottom:10px;letter-spacing:1px;">当前数据概况</div>';
    html += '<div style="background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin-bottom:16px;">';
    rows.forEach(function(r){
      html += '<div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--text-main);">' +
        '<span>' + r[0] + '</span><span style="color:var(--text-sub);">' + r[1] + ' ' + r[2] + '</span></div>';
    });
    html += '</div>';
    html += '<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-sub);margin-bottom:16px;cursor:pointer;">' +
      '<input type="checkbox" id="bkIncludeBg" style="accent-color:var(--accent);"> 导出时包含背景图（文件会变大）</label>';
    html += '<div style="display:flex;gap:8px;margin-bottom:14px;">' +
      '<button class="btn-primary" id="bkExport" style="flex:1;">导出 JSON</button>' +
      '<button class="btn-secondary" id="bkImport" style="flex:1;">导入 JSON</button>' +
      '</div>';
    html += '<div style="border-top:1px solid var(--card-border);padding-top:14px;margin-top:6px;">' +
      '<div style="font-size:11px;color:#e74c3c;letter-spacing:1px;margin-bottom:8px;">⚠ 危险操作</div>' +
      '<button class="btn-secondary" id="bkClear" style="width:100%;color:#e74c3c;border-color:rgba(231,76,60,.4);">清空所有数据</button>' +
      '<div style="font-size:11px;color:var(--text-sub);opacity:.6;text-align:center;margin-top:8px;">操作前建议先导出备份</div></div>';
    openPopup('数据备份', html);

    $('bkExport').addEventListener('click', function(){ exportData($('bkIncludeBg').checked); });
    $('bkImport').addEventListener('click', function(){
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.onchange = function(e){
        var f = e.target.files && e.target.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function(ev){
          try { var json = JSON.parse(ev.target.result); importData(json); }
          catch(err){ showToast('文件解析失败'); }
        };
        reader.readAsText(f);
      };
      input.click();
    });
    $('bkClear').addEventListener('click', clearAllData);
  });
}

function exportData(includeBg){
  var data = {};
  BACKUP_KEYS.forEach(function(k){
    var v = localStorage.getItem(k);
    if (v === null) return;
    try { data[k] = JSON.parse(v); } catch(e){ data[k] = v; }
  });
  var bundle = {
    app: 'larry-workbench',
    version: VERSION,
    exportedAt: new Date().toISOString(),
    includes: Object.keys(data),
    data: data
  };
  function proceed(b){
    var blob = new Blob([JSON.stringify(b, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    var fn = 'larry-workbench-' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + '.json';
    a.href = url; a.download = fn;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('已导出');
  }
  if (!includeBg){ proceed(bundle); return; }
  openDB().then(function(db){
    return new Promise(function(res){
      var tx = db.transaction(STORE,'readonly');
      var req = tx.objectStore(STORE).get('userBg');
      req.onsuccess = function(){
        var r = req.result;
        if (!r || !r.data){ res(bundle); return; }
        var reader = new FileReader();
        reader.onload = function(){
          bundle.data.userBg = reader.result;
          bundle.includes.push('userBg');
          res(bundle);
        };
        reader.onerror = function(){ res(bundle); };
        reader.readAsDataURL(r.data);
      };
      req.onerror = function(){ res(bundle); };
    });
  }).then(proceed);
}

function importData(json){
  if (!json || json.app !== 'larry-workbench' || !json.data){
    showToast('这不是本工作台导出的文件');
    return;
  }
  if (!confirm('将清空当前所有数据并用文件覆盖，确定继续？')) return;

  BACKUP_KEYS.forEach(function(k){ try { localStorage.removeItem(k); } catch(e){} });

  var bgDataUrl = null;
  Object.keys(json.data).forEach(function(k){
    if (k === 'userBg'){ bgDataUrl = json.data[k]; return; }
    var v = json.data[k];
    try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch(e){}
  });

  function finish(){
    showToast('导入成功，即将刷新');
    setTimeout(function(){ location.reload(); }, 700);
  }

  openDB().then(function(db){
    return new Promise(function(res){
      var tx = db.transaction(STORE,'readwrite');
      tx.objectStore(STORE).delete('userBg');
      tx.oncomplete = function(){ res(); };
      tx.onerror = function(){ res(); };
    });
  }).then(function(){
    if (!bgDataUrl){ finish(); return; }
    fetch(bgDataUrl).then(function(r){ return r.blob(); }).then(function(blob){
      return saveBgToDB(blob);
    }).then(finish).catch(finish);
  });
}

function clearAllData(){
  if (!confirm('确定清空所有数据？建议先导出备份。')) return;
  if (!confirm('再次确认：所有待办、便签、密码历史、思维导图等将被永久删除，无法恢复！')) return;
  BACKUP_KEYS.concat(['larryWeatherCache','larryMemo']).forEach(function(k){ try { localStorage.removeItem(k); } catch(e){} });
  openDB().then(function(db){
    return new Promise(function(res){
      var tx = db.transaction(STORE,'readwrite');
      tx.objectStore(STORE).delete('userBg');
      tx.oncomplete = function(){ res(); };
      tx.onerror = function(){ res(); };
    });
  }).then(function(){
    showToast('已清空，即将刷新');
    setTimeout(function(){ location.reload(); }, 700);
  });
}

/* 后台预加载背景图：串行下载 + blob 内存缓存，切图秒开 */
function preloadBackgrounds(){
  var queue = presetBackgrounds.slice();
  // 优先加载当前正在显示的那张
  if (presetIndex >= 0 && presetBackgrounds[presetIndex]){
    var cur = presetBackgrounds[presetIndex];
    var ci = queue.indexOf(cur);
    if (ci > 0){ queue.splice(ci, 1); queue.unshift(cur); }
  }
  function next(){
    if (!queue.length) return;
    var url = queue.shift();
    if (bgCache[url]){ next(); return; }
    fetch(url).then(function(r){
      if (!r.ok) throw new Error();
      return r.blob();
    }).then(function(blob){
      bgCache[url] = URL.createObjectURL(blob);
    }).catch(function(){}).then(function(){
      // 间隔 250ms，避免 CDN 并发限流
      setTimeout(next, 250);
    });
  }
  next();
}

// 页面空闲时立即开始（不等到 3 秒）
if ('requestIdleCallback' in window){
  requestIdleCallback(preloadBackgrounds, { timeout: 2000 });
} else {
  window.addEventListener('load', function(){ setTimeout(preloadBackgrounds, 500); });
}
