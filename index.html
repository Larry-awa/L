<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>Larry 的工作台</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

/* ============ 引文字体：按语种分离 ============ */
@font-face {
  font-family: 'LarryQuote';
  src: local('Baskerville Old Face'),
       local('Baskerville'),
       local('Iowan Old Style'),
       local('Bodoni MT'),
       local('Bodoni 72'),
       local('Didot'),
       local('Georgia');
  unicode-range: U+0020-007F, U+00A0-00FF, U+0100-017F, U+2000-206F, U+2070-209F, U+20A0-20CF, U+2100-214F, U+2190-21FF;
  font-style: italic;
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'LarryQuote';
  src: local('Constantia'),
       local('Cambria'),
       local('PT Serif'),
       local('Georgia');
  unicode-range: U+0301, U+0400-045F, U+0483-0489, U+0490-0491, U+04B0-04B1, U+04D0-04FF, U+0500-052F, U+2116, U+2DE0-2DFF, U+A640-A69F;
  font-style: italic;
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'LarryQuote';
  src: local('KaiTi'),
       local('STKaiti'),
       local('Kaiti SC'),
       local('楷体');
  unicode-range: U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF;
  font-style: italic;
  font-weight: 400;
  font-display: swap;
}

:root{
  --bg-base:#f5f3ed;
  --card-bg:linear-gradient(135deg, rgba(255,255,255,.78), rgba(255,255,255,.58));
  --card-border:rgba(0,0,0,.06);
  --text-main:#1a1a1a;
  --text-sub:#888;
  --accent:#b29d7a;
  --accent-soft:rgba(178,157,122,.12);
  --grad-pill:linear-gradient(135deg, rgba(255,255,255,.78), rgba(255,255,255,.58));
  --grad-primary:linear-gradient(135deg, #c4b192, #a8926e);
  --radius:18px;
  --gap:12px;
  --shadow:0 8px 24px rgba(0,0,0,.06);
  --pill-active-bg:linear-gradient(135deg, #2a2a2a, #0f0f0f);
  --pill-active-text:#fff;
  --hover-border:rgba(140,155,171,.7);
  --flip-bg:linear-gradient(180deg, #2f2f2f, #111);
  --flip-text:#fff;
}
body.dark-mode{
  --bg-base:#111;--card-bg:linear-gradient(135deg, rgba(35,35,35,.72), rgba(20,20,20,.58));
  --card-border:rgba(255,255,255,.08);--text-main:#f0f0f0;--text-sub:#a0a0a0;
  --accent:#d4af37;--accent-soft:rgba(212,175,55,.14);
  --grad-pill:linear-gradient(135deg, rgba(35,35,35,.82), rgba(20,20,20,.62));
  --grad-primary:linear-gradient(135deg, #d4af37, #b8992c);
  --shadow:0 8px 24px rgba(0,0,0,.4);
  --pill-active-bg:linear-gradient(135deg, #d4af37, #b8992c);
  --pill-active-text:#000;--hover-border:rgba(190,195,205,.7);
  --flip-bg:linear-gradient(180deg, #d4af37, #b8992c);--flip-text:#000;
}
body.image-mode{
  --pill-active-bg:linear-gradient(135deg, rgba(245,245,245,.98), rgba(230,230,230,.9));
  --pill-active-text:#1a1a1a;--text-main:#fff;--text-sub:rgba(255,255,255,.72);
  --accent:rgba(200,215,235,.95);--accent-soft:rgba(200,215,235,.14);
  --card-bg:linear-gradient(135deg, rgba(255,255,255,.1), rgba(255,255,255,.04));
  --card-border:rgba(255,255,255,.14);
  --grad-pill:linear-gradient(135deg, rgba(255,255,255,.13), rgba(255,255,255,.06));
  --grad-primary:linear-gradient(135deg, rgba(200,215,235,.95), rgba(175,195,220,.95));
  --hover-border:rgba(200,215,235,.65);
  --flip-bg:linear-gradient(180deg, rgba(200,215,235,.95), rgba(175,195,220,.9));
  --flip-text:#1a1a1a;
}

body{
  font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg-base);
  color:var(--text-main);
  padding:8px;padding-right:calc(8px + env(safe-area-inset-right,0px));
  min-height:100vh;display:flex;justify-content:center;
  transition:background .4s ease,color .4s ease;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overflow-y:auto;overflow-x:hidden;
}

.bg-layer{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity .25s ease;pointer-events:none;will-change:opacity;}
body.image-mode .bg-layer.active{opacity:1;}
body.dark-mode .bg-layer.active{opacity:0;}
body.dark-mode:not(.image-mode)::before{content:'';position:fixed;inset:0;z-index:-3;background:linear-gradient(180deg,#1a1a1a,#0a0a0a);}

.app{width:100%;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;height:auto;min-height:100vh;padding-top:8px;}

.top-bar{display:flex;justify-content:space-between;align-items:flex-end;padding:4px 6px 12px;flex-wrap:wrap;gap:8px;flex-shrink:0;}
.top-bar h1{font-size:22px;font-weight:600;letter-spacing:.5px;color:var(--text-main);transition:color .4s;}
.top-bar .signature{font-style:italic;font-size:15px;color:var(--accent);margin-top:6px;transition:color .4s;}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

/* 问候语 chip */
.greet-chip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:5px 14px;
  border-radius:40px;
  background:linear-gradient(135deg, rgba(255,246,232,.92), rgba(244,234,214,.78));
  border:1px solid rgba(178,157,122,.28);
  font-size:12px;
  font-weight:600;
  color:#8b7355;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  white-space:nowrap;
  user-select:none;
  transition:background .3s ease, border-color .3s ease, color .3s ease;
}
.greet-text{color:#a8926e;letter-spacing:.3px;}
.greet-time{
  font-family:'SF Mono','Cascadia Mono',Consolas,Menlo,monospace;
  font-variant-numeric:tabular-nums;
  color:#5c4a32;
  letter-spacing:.3px;
}
body.dark-mode .greet-chip{
  background:linear-gradient(135deg, rgba(48,42,30,.78), rgba(22,20,14,.6));
  border-color:rgba(212,175,55,.28);
  color:#d4af37;
}
body.dark-mode .greet-text{color:#d4af37;}
body.dark-mode .greet-time{color:#f0f0f0;}
body.image-mode .greet-chip{
  background:linear-gradient(135deg, rgba(200,215,235,.22), rgba(200,215,235,.09));
  border-color:rgba(200,215,235,.38);
  color:#fff;
}
body.image-mode .greet-text{color:rgba(220,232,245,.95);}
body.image-mode .greet-time{color:#fff;}

.pill-btn{position:relative;background:var(--grad-pill);border:1px solid var(--card-border);padding:5px 12px;border-radius:40px;font-size:12px;font-weight:600;color:var(--text-sub);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .2s, box-shadow .3s;-webkit-tap-highlight-color:transparent;white-space:nowrap;}
.pill-btn:hover{transform:scale(1.03);box-shadow:0 4px 14px rgba(0,0,0,.1);}
.pill-btn:active{transform:scale(.97);}

.segment{display:inline-flex;background:var(--grad-pill);border:1px solid var(--card-border);border-radius:40px;padding:3px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);-webkit-tap-highlight-color:transparent;}
.segment .seg-item{padding:3px 12px;border-radius:30px;font-size:11px;font-weight:600;color:var(--text-sub);cursor:pointer;transition:background .3s,color .3s;white-space:nowrap;user-select:none;}
.segment .seg-item.active{background:var(--pill-active-bg);color:var(--pill-active-text);}
.segment .seg-item:not(.active):hover{color:var(--text-main);}

.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(6,minmax(120px,1fr));gap:var(--gap);flex:1;min-height:760px;}
.grid-item{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .25s, box-shadow .25s, border-color .25s;position:relative;overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);-webkit-tap-highlight-color:transparent;}
.grid-item:hover{transform:translateY(-3px);border-color:var(--hover-border);box-shadow:var(--shadow);}
.card-header{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text-main);flex-wrap:wrap;background:transparent !important;border:none !important;box-shadow:none !important;padding:0 !important;border-radius:0 !important;position:relative;z-index:2;}
.card-icon{
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;color:var(--text-main);flex-shrink:0;
  transition:transform .28s cubic-bezier(.16,1,.3,1), color .3s ease;
  transform-origin:center;
}
.card-icon svg{width:100%;height:100%;display:block;}
.grid-item:hover .card-icon{transform:scale(1.18) rotate(-6deg);color:var(--accent);}

.grid-item::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%);
  transform:translateX(-120%);
  transition:transform .55s ease;
  pointer-events:none;
  z-index:1;
}
.grid-item:hover::before{transform:translateX(120%);}
body.dark-mode .grid-item::before{
  background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.06) 50%, transparent 65%);
}
body.image-mode .grid-item::before{
  background:linear-gradient(115deg, transparent 35%, rgba(200,215,235,.16) 50%, transparent 65%);
}
.grid-item .card-header,
.grid-item .card-body,
.grid-item > div:not(.card-header):not(.card-body){position:relative;z-index:2;}

.card-body{margin-top:6px;font-size:11px;color:var(--text-sub);line-height:1.4;transition:color .3s;background:none;border:none;}

.card-quotes{grid-column:1/3;grid-row:1/2;}
.card-todo{grid-column:3/4;grid-row:1/2;}
.card-tests{grid-column:1/3;grid-row:2/4;}
.card-weather{grid-column:3/4;grid-row:2/3;}
.card-memo{grid-column:3/4;grid-row:3/4;}
.card-pomo{grid-column:1/2;grid-row:4/5;}
.card-calc{grid-column:2/3;grid-row:4/5;}
.card-pwd{grid-column:3/4;grid-row:4/5;}
.card-mind{grid-column:1/2;grid-row:5/6;}
.card-count{grid-column:2/3;grid-row:5/6;}
.card-tools{grid-column:3/4;grid-row:5/6;}
.card-cal{grid-column:1/4;grid-row:6/7;}

/* 天气骨架屏 */
.weather-slot{position:relative;min-height:52px;}
.weather-skeleton{display:flex;flex-direction:column;gap:8px;padding-top:2px;}
.sk-line{
  border-radius:8px;
  background:linear-gradient(90deg, rgba(128,128,128,.12) 25%, rgba(128,128,128,.26) 50%, rgba(128,128,128,.12) 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s ease-in-out infinite;
}
.sk-temp{width:76px;height:32px;}
.sk-desc{width:52px;height:12px;border-radius:6px;animation-delay:.15s;}
@keyframes shimmer{
  0%{background-position:-200% 0;}
  100%{background-position:200% 0;}
}
body.dark-mode .sk-line{
  background:linear-gradient(90deg, rgba(255,255,255,.06) 25%, rgba(255,255,255,.16) 50%, rgba(255,255,255,.06) 75%);
  background-size:200% 100%;
}
body.image-mode .sk-line{
  background:linear-gradient(90deg, rgba(255,255,255,.08) 25%, rgba(255,255,255,.22) 50%, rgba(255,255,255,.08) 75%);
  background-size:200% 100%;
}
.weather-real{display:none;}
.weather-real.show{display:block;animation:weatherIn .4s cubic-bezier(.16,1,.3,1);}
@keyframes weatherIn{
  from{opacity:0;transform:translateY(4px);}
  to{opacity:1;transform:translateY(0);}
}

.weather-temp{font-size:30px;font-weight:300;line-height:1;color:var(--text-main);letter-spacing:-1px;font-family:'SF Mono','Cascadia Mono',Consolas,Menlo,monospace;font-variant-numeric:tabular-nums;}
.weather-desc{font-size:11px;color:var(--text-sub);margin-top:4px;}
.cal-mini{font-size:11px;color:var(--text-sub);margin-top:2px;}

#fileInput{display:none;}

.dynamic-island{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120%);width:calc(100% - 32px);max-width:380px;background:linear-gradient(135deg, rgba(28,28,30,.95), rgba(15,15,18,.9));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.08);border-radius:40px;padding:10px 10px 10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:999;opacity:0;transition:transform .45s cubic-bezier(.175,.885,.32,1.275),opacity .3s;pointer-events:none;}
.dynamic-island.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto;}
.dynamic-island .island-text{color:#f0f0f0;font-size:13px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dynamic-island .island-text .dot{color:var(--accent);margin:0 4px;opacity:.85;}
.dynamic-island .island-btn{background:var(--accent);color:#000;border:none;padding:8px 18px;border-radius:30px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;}
@media(hover:hover) and (pointer:fine){.dynamic-island{display:none;}}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(135deg, rgba(20,20,20,.9), rgba(0,0,0,.85));color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;z-index:99999;transition:transform .4s cubic-bezier(.175,.885,.32,1.275);pointer-events:none;backdrop-filter:blur(10px);max-width:80vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}

.popup-overlay{
  position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .18s ease-in, visibility 0s linear .18s;
}
.popup-overlay.show{
  opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .2s ease-out, visibility 0s linear 0s;
}
.popup-box{
  background:var(--bg-base);border-radius:24px;padding:0;
  max-width:600px;width:100%;max-height:85vh;overflow-y:auto;
  box-shadow:0 24px 70px rgba(0,0,0,.32);color:var(--text-main);
  position:relative;overflow-x:hidden;
  opacity:0;
  transform:scale(.94) translateY(10px);
  filter:blur(4px);
  transition:opacity .18s ease-in, transform .18s ease-in, filter .18s ease-in;
  will-change:transform, opacity, filter;
}
.popup-overlay.show .popup-box{
  opacity:1;
  transform:scale(1) translateY(0);
  filter:blur(0);
  transition:opacity .28s cubic-bezier(.16,1,.3,1), transform .28s cubic-bezier(.16,1,.3,1), filter .28s cubic-bezier(.16,1,.3,1);
}
.popup-box::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg, transparent, var(--accent), transparent);opacity:.55;pointer-events:none;}
.popup-box::after{content:'';position:absolute;top:-80px;right:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle, var(--accent-soft), transparent 70%);opacity:.9;pointer-events:none;z-index:0;}
.popup-box > *{position:relative;z-index:1;}
.popup-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;position:sticky;top:0;background:inherit;padding:22px 28px 14px;z-index:3;}
#popupContent{padding:0 28px 26px;}
.popup-title{font-size:17px;font-weight:600;letter-spacing:.3px;}

body.image-mode .popup-overlay{background:rgba(0,0,0,.18);}
body.image-mode .popup-box{
  --text-main:#fff;--text-sub:rgba(255,255,255,.68);
  --card-bg:linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
  --card-border:rgba(255,255,255,.14);
  --accent:rgba(200,215,235,.95);--accent-soft:rgba(200,215,235,.14);
  --hover-border:rgba(200,215,235,.65);
  background:linear-gradient(160deg, rgba(25,28,35,.7), rgba(12,14,18,.6));
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.12);color:#fff;
}

.btn-primary{background:var(--grad-primary);color:#000;border:none;border-radius:30px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:filter .2s, transform .15s;-webkit-tap-highlight-color:transparent;box-shadow:0 2px 10px var(--accent-soft);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:active{transform:scale(.97);}
.btn-secondary{background:transparent;color:var(--text-main);border:1px solid var(--card-border);border-radius:30px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;-webkit-tap-highlight-color:transparent;}
.btn-secondary:hover{border-color:var(--hover-border);}
.input-field{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--card-border);background:transparent;color:var(--text-main);font-size:14px;outline:none;font-family:inherit;transition:border-color .2s;}
.input-field:focus{border-color:var(--accent);}
body.image-mode .input-field{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:#fff;}
body.image-mode .btn-secondary{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#fff;}

/* 引文 */
.quote-text{
  font-family:'LarryQuote', Georgia, "KaiTi", "STKaiti", "楷体", serif;
  font-style:italic;
  font-size:26px;
  line-height:1.7;
  color:var(--text-main);
  font-weight:400;
}
.quote-text .cn{
  font-family:'LarryQuote', "KaiTi", "STKaiti", "Kaiti SC", "楷体", serif;
}
.quote-trans{
  font-family:'LarryQuote', Georgia, "KaiTi", "STKaiti", "楷体", serif;
  font-style:normal;
  font-size:14px;
  color:var(--text-sub);
  margin-top:14px;
  line-height:1.6;
}
.quote-trans .cn{
  font-family:'LarryQuote', "KaiTi", "STKaiti", "Kaiti SC", "楷体", serif;
}
.quote-source{font-family:'LarryQuote', Georgia, "KaiTi", "STKaiti", "楷体", serif;font-style:normal;font-size:12px;color:var(--text-sub);margin-top:16px;opacity:.75;}
.quote-hint{font-size:11px;color:var(--text-sub);margin-top:22px;opacity:.5;}

/* 待办 */
.todo-list{margin-top:12px;max-height:60vh;overflow-y:auto;}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--card-border);}
.todo-num{font-size:12px;color:var(--text-sub);font-family:'Iowan Old Style',Georgia,serif;min-width:20px;}
.todo-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--text-sub);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s;}
.todo-check.done{background:var(--accent);border-color:var(--accent);}
.todo-check.done::after{content:'✓';color:#000;font-size:12px;font-weight:700;}
.todo-text{flex:1;font-size:14px;color:var(--text-main);cursor:pointer;word-break:break-all;}
.todo-text.done{text-decoration:line-through;color:var(--text-sub);}
.todo-del{color:var(--text-sub);cursor:pointer;font-size:16px;padding:0 6px;}
.todo-del:hover{color:#e74c3c;}
body.image-mode .todo-item{border-bottom-color:rgba(255,255,255,.1);}
body.image-mode .todo-text{color:#fff;}

/* 测试 */
.test-menu{display:flex;flex-direction:column;gap:10px;}
.test-menu-item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--card-border);cursor:pointer;transition:.2s;}
.test-menu-item:hover{border-color:var(--hover-border);background:var(--accent-soft);}
.test-menu-item .name{font-size:14px;font-weight:600;}
.test-menu-item .desc{font-size:11px;color:var(--text-sub);margin-top:2px;}
.test-menu-item .arrow{color:var(--text-sub);}
.test-q-title{font-size:15px;font-weight:600;margin-bottom:14px;line-height:1.5;}
.test-progress{height:4px;background:rgba(128,128,128,.15);border-radius:4px;margin-bottom:20px;overflow:hidden;}
.test-progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s;width:0%;}
.test-opt{padding:12px 14px;border-radius:12px;border:1px solid var(--card-border);font-size:14px;cursor:pointer;margin-bottom:8px;transition:.2s;display:flex;align-items:center;gap:10px;line-height:1.5;}
.test-opt:hover{border-color:var(--hover-border);}
.test-opt.selected{border-color:var(--accent);background:var(--accent-soft);}
.test-opt .opt-mark{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--text-sub);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s;font-size:11px;color:transparent;font-weight:700;}
.test-opt.selected .opt-mark{border-color:var(--accent);background:var(--accent);color:#000;}
.test-opt.selected .opt-mark::after{content:'✓';}
.test-nav{display:flex;gap:8px;margin-top:16px;align-items:center;}
.test-step{font-size:12px;color:var(--text-sub);margin-left:auto;font-family:'Iowan Old Style',Georgia,serif;font-variant-numeric:tabular-nums;}

/* 测试报告 */
.test-report{padding:2px 0 0;}
.report-head{text-align:center;padding:6px 0 24px;border-bottom:1px solid var(--card-border);}
.report-badge{font-size:11px;color:var(--accent);letter-spacing:3px;margin-bottom:12px;font-family:'Iowan Old Style',Georgia,serif;}
.report-main-title{font-size:26px;font-weight:700;color:var(--text-main);font-family:'Iowan Old Style',Georgia,serif;letter-spacing:.3px;line-height:1.3;}
.report-subtitle{font-size:13px;color:var(--text-sub);margin-top:10px;line-height:1.7;font-style:italic;}
.report-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px;}
.report-tag{display:inline-block;padding:4px 12px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.5px;}
.report-section{margin-top:24px;}
.report-section-title{font-size:12px;color:var(--accent);letter-spacing:3px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-family:'Iowan Old Style',Georgia,serif;}
.report-section-title::before{content:'';width:16px;height:1px;background:var(--accent);flex-shrink:0;}
.report-section-title::after{content:'';flex:1;height:1px;background:var(--card-border);}
.report-text{font-size:13px;color:var(--text-main);line-height:1.9;}
.report-text + .report-text{margin-top:8px;}
.report-list{list-style:none;padding:0;margin:0;}
.report-list li{font-size:13px;color:var(--text-main);line-height:1.75;padding:7px 0 7px 20px;position:relative;}
.report-list li::before{content:'';position:absolute;left:2px;top:16px;width:8px;height:1px;background:var(--accent);}
.report-bar-item{margin-bottom:18px;}
.report-bar-item:last-child{margin-bottom:0;}
.report-bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-sub);margin-bottom:8px;}
.report-bar-label .on{color:var(--text-main);font-weight:600;}
.report-bar-track{position:relative;height:6px;background:var(--accent-soft);border-radius:6px;overflow:hidden;}
.report-bar-left{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px;width:0;transition:width .7s cubic-bezier(.16,1,.3,1);}
.report-bar-num{display:flex;justify-content:space-between;font-size:11px;color:var(--text-sub);margin-top:5px;font-family:'Iowan Old Style',Georgia,serif;font-variant-numeric:tabular-nums;}
.report-score-big{text-align:center;padding:12px 0 8px;}
.report-score-num{font-size:72px;font-weight:200;color:var(--accent);font-family:'Iowan Old Style',Georgia,serif;line-height:1;letter-spacing:-3px;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:'lnum' 1, 'tnum' 1;}
.report-score-total{font-size:20px;color:var(--text-sub);font-family:'Iowan Old Style',Georgia,serif;margin-left:4px;}
.report-score-label{font-size:12px;color:var(--text-sub);margin-top:12px;letter-spacing:3px;font-family:'Iowan Old Style',Georgia,serif;}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.report-grid-item{padding:14px 16px;border:1px solid var(--card-border);border-radius:12px;background:var(--card-bg);}
.report-grid-item .lbl{font-size:11px;color:var(--text-sub);letter-spacing:1px;}
.report-grid-item .val{font-size:22px;color:var(--text-main);font-weight:600;font-family:'Iowan Old Style',Georgia,serif;margin-top:6px;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:'lnum' 1, 'tnum' 1;line-height:1;}
.report-grid-item .sub{font-size:11px;color:var(--text-sub);margin-top:4px;}
.report-foot{margin-top:28px;padding-top:18px;border-top:1px dashed var(--card-border);text-align:center;font-size:11px;color:var(--text-sub);opacity:.6;letter-spacing:2px;font-family:'Iowan Old Style',Georgia,serif;}
.report-disclaimer{margin-top:14px;font-size:11px;color:var(--text-sub);opacity:.55;line-height:1.7;text-align:center;}
@media(max-width:480px){.report-grid{grid-template-columns:1fr;}}
/* 密码 */
.pwd-display{font-family:'Iowan Old Style',Georgia,monospace;font-size:18px;font-weight:700;text-align:center;padding:16px;border-radius:12px;background:var(--accent-soft);word-break:break-all;letter-spacing:1px;margin-bottom:14px;}
.pwd-controls{display:flex;gap:10px;margin-bottom:14px;}
.pwd-controls button{flex:1;}
.pwd-slider{width:100%;accent-color:var(--accent);margin-bottom:12px;}
.pwd-checks{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--text-sub);}
.pwd-checks label{display:flex;align-items:center;gap:6px;cursor:pointer;}
.pwd-checks input{accent-color:var(--accent);}
.pwd-strength{height:6px;border-radius:4px;background:rgba(128,128,128,.15);margin:4px 0 6px;overflow:hidden;}
.pwd-strength-bar{height:100%;border-radius:4px;transition:width .3s,background .3s;width:0%;}
.pwd-strength-label{font-size:11px;color:var(--text-sub);text-align:right;margin-bottom:16px;}
.pwd-history{margin-top:20px;padding-top:16px;border-top:1px solid var(--card-border);}
.pwd-history-item{display:flex;align-items:center;gap:10px;padding:8px 0;font-family:'Iowan Old Style',Georgia,monospace;font-size:13px;color:var(--text-main);border-bottom:1px solid var(--card-border);}
.pwd-history-item span:first-child{flex:1;word-break:break-all;}
.pwd-history-item button{background:transparent;border:none;color:var(--text-sub);cursor:pointer;font-size:12px;padding:2px 6px;}

/* 便签多标签 */
.memo-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.memo-tab{padding:5px 12px;border-radius:20px;border:1px solid var(--card-border);font-size:12px;color:var(--text-sub);cursor:pointer;transition:.2s;display:flex;align-items:center;gap:6px;}
.memo-tab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text-main);font-weight:600;}
.memo-tab .del{font-size:14px;opacity:.5;line-height:1;}
.memo-tab .del:hover{opacity:1;color:#e74c3c;}
.memo-new{padding:5px 12px;border-radius:20px;border:1px dashed var(--card-border);font-size:12px;color:var(--text-sub);cursor:pointer;transition:.2s;}
.memo-new:hover{border-color:var(--accent);color:var(--accent);}
.memo-textarea{width:100%;height:220px;border:none;background:transparent;color:var(--text-main);font-size:14px;line-height:1.7;outline:none;resize:none;font-family:inherit;}

/* 番茄钟 */
.pomo-ring-wrap{position:relative;width:220px;height:220px;margin:20px auto 0;}
.pomo-ring{width:100%;height:100%;transform:rotate(-90deg);}
.pomo-ring circle{fill:none;stroke-width:6;}
.pomo-ring .pomo-bg{stroke:rgba(128,128,128,.15);}
.pomo-ring .pomo-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
.pomo-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.pomo-display{
  font-size:48px;
  font-weight:300;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
  font-variant-numeric:tabular-nums;
  font-feature-settings:'tnum';
  color:var(--text-main);
  margin:0;
  letter-spacing:0;
  width:170px;
  text-align:center;
}
.pomo-modes{display:flex;gap:8px;justify-content:center;margin:20px 0 22px;}
.pomo-mode{padding:6px 16px;border-radius:20px;border:1px solid var(--card-border);background:transparent;color:var(--text-sub);font-size:12px;cursor:pointer;font-family:inherit;transition:.2s;}
.pomo-mode.active{background:var(--accent);color:#000;border-color:var(--accent);}
.pomo-actions{display:flex;gap:10px;justify-content:center;}
.pomo-actions button{min-width:110px;}

/* 计算器 */
.calc-screen{text-align:right;font-size:32px;font-family:'Iowan Old Style',Georgia,monospace;padding:8px 0;min-height:44px;margin-bottom:12px;color:var(--text-main);word-break:break-all;}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.calc-btn{padding:12px 0;border:1px solid var(--card-border);border-radius:14px;background:var(--card-bg);color:var(--text-main);font-size:16px;cursor:pointer;transition:.2s;font-family:'Iowan Old Style',Georgia,inherit;backdrop-filter:blur(6px);}
.calc-btn:hover{border-color:var(--hover-border);}
.calc-btn.op{background:var(--accent-soft);}
.calc-btn.fn{font-size:13px;color:var(--text-sub);}
.calc-btn.eq{background:var(--accent);color:#000;}
.unit-section{margin-top:20px;padding-top:20px;border-top:1px solid var(--card-border);}
.unit-title{font-size:13px;font-weight:600;color:var(--text-sub);margin-bottom:12px;}
.unit-row{display:flex;gap:6px;margin-bottom:10px;}
.unit-row select,.unit-row input{flex:1;padding:8px;border-radius:10px;border:1px solid var(--card-border);background:transparent;color:var(--text-main);font-size:13px;outline:none;min-width:0;font-family:inherit;}
.unit-result{margin-top:12px;font-size:14px;text-align:center;color:var(--text-main);padding:10px;background:var(--accent-soft);border-radius:10px;}

/* 翻页时钟倒计时 */
.flip-clock{display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:24px 0 12px;flex-wrap:wrap;}
.flip-digit{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:58px;height:82px;background:var(--flip-bg);color:var(--flip-text);
  font-size:52px;font-weight:300;font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
  border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.28), inset 0 -3px 0 rgba(0,0,0,.18);
  letter-spacing:-2px;
}
.flip-digit::before{content:'';position:absolute;left:8%;right:8%;top:50%;height:1px;background:rgba(255,255,255,.14);}
body.dark-mode .flip-digit::before{background:rgba(0,0,0,.18);}
body.image-mode .flip-digit::before{background:rgba(0,0,0,.18);}
.flip-unit{font-size:16px;color:var(--text-sub);margin-left:6px;margin-bottom:14px;font-family:'Iowan Old Style',Georgia,serif;}
.count-label{font-size:13px;color:var(--text-sub);text-align:center;margin-top:4px;}
.count-empty{text-align:center;color:var(--text-sub);font-size:13px;padding:30px 0;}

/* 纪念日 */
.count-date-row{display:flex;align-items:center;justify-content:center;gap:5px;}
.count-sel{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  padding:10px 26px 10px 14px;
  border-radius:12px;
  border:1px solid var(--card-border);
  background:transparent;
  color:var(--text-main);
  font-size:15px;
  font-family:'Iowan Old Style',Georgia,serif;
  font-variant-numeric:tabular-nums;
  outline:none;
  cursor:pointer;
  text-align:center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6' viewBox='0 0 9 6'><path d='M1 1l3.5 3.5L8 1' fill='none' stroke='%23888888' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;
  background-position:right 9px center;
  transition:border-color .2s;
}
.count-sel:hover,.count-sel:focus{border-color:var(--accent);}
.count-sel option{background:#1a1a1a;color:#f0f0f0;}
body.image-mode .count-sel option{background:#1a1d24;color:#fff;}
.count-year{min-width:92px;}
.count-month,.count-day{min-width:62px;}
.count-sep{font-size:12px;color:var(--text-sub);}

/* 数字与单位对齐：底部对齐，数字大、单位小但不歪 */
.count-result{
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:0;
  flex-wrap:wrap;
  margin-top:8px;
  line-height:1;
}
.count-num{
  font-size:40px;
  font-weight:300;
  color:var(--text-main);
  font-family:'Iowan Old Style',Georgia,serif;
  font-variant-numeric:lining-nums tabular-nums;
  font-feature-settings:'lnum' 1, 'tnum' 1;
  line-height:1;
  letter-spacing:-1px;
}
.count-unit{
  font-size:14px;
  color:var(--text-sub);
  margin:0 10px 0 4px;
  font-family:'Iowan Old Style',Georgia,serif;
  line-height:1;
}
/* 纪念日列表 */
.count-list-head{font-size:11px;color:var(--text-sub);letter-spacing:2px;margin:24px 0 8px;padding-top:18px;border-top:1px solid var(--card-border);}
.count-item{padding:16px 0;border-bottom:1px solid var(--card-border);}
.count-item:last-child{border-bottom:none;}
.count-item-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.count-item-name{font-size:14px;font-weight:600;color:var(--text-main);flex:1;word-break:break-all;}
.count-item-date{font-size:11px;color:var(--text-sub);font-family:'Iowan Old Style',Georgia,serif;font-variant-numeric:tabular-nums;flex-shrink:0;}
.count-del{background:transparent;border:none;color:var(--text-sub);font-size:18px;line-height:1;padding:0 4px;cursor:pointer;transition:color .2s;flex-shrink:0;font-family:inherit;}
.count-del:hover{color:#e74c3c;}
.count-empty-list{text-align:center;color:var(--text-sub);font-size:13px;padding:20px 0;opacity:.6;}

/* 去掉 number input 的旧式上下箭头 */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}
input[type=number]{
  -moz-appearance:textfield;
}

/* 日历 */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cal-nav{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--card-border);
  background:transparent;color:var(--text-main);font-size:20px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.2s;font-family:inherit;padding:0 0 2px;
}
.cal-nav:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.cal-title{font-size:16px;font-weight:600;flex:1;text-align:center;}

.cal-day{
  padding:6px 2px 4px;text-align:center;border-radius:8px;cursor:pointer;transition:.15s;
  display:flex;flex-direction:column;align-items:center;gap:1px;min-height:42px;
}
.cal-day-num{font-size:12px;line-height:1;font-variant-numeric:tabular-nums;}
.cal-holiday{font-size:9px;color:var(--accent);font-weight:600;line-height:1;opacity:.9;transform:scale(.92);}

/* 今天 = 淡底色 + 描边 */
.cal-day.today{
  background:var(--accent-soft);
  border:1px solid var(--accent);
  color:var(--accent);
  font-weight:700;
}
.cal-day.today:hover{
  background:rgba(178,157,122,.22);
}
body.dark-mode .cal-day.today:hover{
  background:rgba(212,175,55,.24);
}
.cal-day.today .cal-holiday{color:var(--accent);}

/* 选中 = 实底色 */
.cal-day.selected,
.cal-day.selected-today{
  background:var(--accent);
  color:#fff;
  font-weight:700;
  box-shadow:0 2px 8px var(--accent-soft);
}
.cal-day.selected .cal-holiday,
.cal-day.selected-today .cal-holiday{color:rgba(255,255,255,.9);}

/* 悬停 */
.cal-day:hover{background:var(--accent-soft);}
.cal-day.selected:hover,
.cal-day.selected-today:hover{background:var(--accent);}

body.image-mode .cal-day.today{border-color:var(--accent);color:var(--accent);}
body.image-mode .cal-day.selected,
body.image-mode .cal-day.selected-today{color:#1a1a1a;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:12px;}
.cal-weekday{color:var(--text-sub);padding:6px 0;text-align:center;font-weight:600;}
.cal-day.other{opacity:.28;}
.cal-info{margin-top:16px;padding-top:16px;border-top:1px solid var(--card-border);}
.cal-info-row{display:flex;gap:12px;font-size:13px;margin-bottom:8px;}
.cal-info-label{color:var(--text-sub);min-width:52px;}
.cal-info-val{color:var(--text-main);flex:1;}
.cal-disclaimer{text-align:center;font-size:11px;color:var(--text-sub);opacity:.55;margin-top:16px;letter-spacing:1px;}

/* 思维导图 */
.mind-container{position:relative;width:100%;height:480px;overflow:hidden;border-radius:14px;background:linear-gradient(135deg, rgba(128,128,128,.06), rgba(128,128,128,.02));border:1px solid var(--card-border);}
.mind-svg{position:absolute;inset:0;pointer-events:none;overflow:visible;shape-rendering:geometricPrecision;}
.mind-svg path{stroke:rgba(178,157,122,.5);stroke-width:2;fill:none;stroke-linecap:round;}
body.dark-mode .mind-svg path{stroke:rgba(212,175,55,.5);}
body.image-mode .mind-svg path{stroke:rgba(200,215,235,.55);}
.mind-node{position:absolute;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:500;cursor:pointer;transform:translate(-50%,-50%);user-select:none;white-space:nowrap;border:1px solid transparent;transition:transform .2s, box-shadow .2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-rendering:geometricPrecision;}
.mind-node:hover{transform:translate(-50%,-50%) scale(1.06);z-index:10;}
.mind-node.depth-0{background:linear-gradient(135deg, #c4b192, #a8926e);color:#fff;font-weight:700;box-shadow:0 6px 20px rgba(178,157,122,.4);}
.mind-node.depth-1{background:linear-gradient(135deg, rgba(178,157,122,.28), rgba(178,157,122,.14));color:var(--text-main);border-color:rgba(178,157,122,.35);}
.mind-node.depth-2{background:linear-gradient(135deg, rgba(178,157,122,.16), rgba(178,157,122,.07));color:var(--text-main);border-color:rgba(178,157,122,.22);}
.mind-node.depth-3{background:linear-gradient(135deg, rgba(178,157,122,.09), rgba(178,157,122,.03));color:var(--text-main);border-color:rgba(178,157,122,.15);}
body.dark-mode .mind-node.depth-0{background:linear-gradient(135deg, #d4af37, #b8992c);color:#000;}
body.dark-mode .mind-node.depth-1{background:linear-gradient(135deg, rgba(212,175,55,.28), rgba(212,175,55,.14));color:#f0f0f0;border-color:rgba(212,175,55,.35);}
body.dark-mode .mind-node.depth-2{background:linear-gradient(135deg, rgba(212,175,55,.16), rgba(212,175,55,.07));color:#f0f0f0;border-color:rgba(212,175,55,.22);}
body.dark-mode .mind-node.depth-3{background:linear-gradient(135deg, rgba(212,175,55,.09), rgba(212,175,55,.03));color:#f0f0f0;border-color:rgba(212,175,55,.15);}
body.image-mode .mind-node.depth-0{background:linear-gradient(135deg, rgba(200,215,235,.95), rgba(175,195,220,.9));color:#1a1a1a;font-weight:700;}
body.image-mode .mind-node.depth-1{background:linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.08));color:#fff;border-color:rgba(255,255,255,.25);}
body.image-mode .mind-node.depth-2{background:linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.05));color:#fff;border-color:rgba(255,255,255,.18);}
body.image-mode .mind-node.depth-3{background:linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.03));color:rgba(255,255,255,.9);border-color:rgba(255,255,255,.12);}

/* 工具台 */
.tool-menu{display:flex;flex-direction:column;gap:10px;}
.tool-item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--card-border);cursor:pointer;transition:.2s;}
.tool-item:hover{border-color:var(--hover-border);background:var(--accent-soft);}
.tool-item .name{font-size:14px;font-weight:600;}
.tool-item .desc{font-size:11px;color:var(--text-sub);margin-top:2px;}
.tool-item .arrow{color:var(--text-sub);}

.color-preview{width:100%;height:120px;border-radius:12px;margin:14px 0;box-shadow:0 4px 20px rgba(0,0,0,.12);}
.color-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.color-row input[type=color]{width:50px;height:36px;border:none;background:transparent;cursor:pointer;}
.color-row input[type=text]{flex:1;font-family:'Iowan Old Style',Georgia,monospace;}

.palette-img{width:100%;max-height:320px;border-radius:12px;margin-bottom:16px;object-fit:contain;}
.palette-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.palette-label{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:4px 12px;border-radius:20px;background:var(--accent-soft);color:var(--text-main);font-size:12px;font-weight:600;}
.palette-label .val{color:var(--accent);font-family:'Iowan Old Style',Georgia,serif;}
.palette-slider{width:100%;accent-color:var(--accent);}

.qr-placeholder{text-align:center;padding:40px 0;color:var(--text-sub);}

/* 天气 */
.weather-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px 0;border-top:1px solid var(--card-border);border-bottom:1px solid var(--card-border);}
.weather-grid-item{text-align:center;}
.weather-grid-item .val{font-size:16px;font-weight:600;color:var(--text-main);}
.weather-grid-item .lbl{font-size:11px;color:var(--text-sub);margin-top:6px;}
.weather-days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;-ms-overflow-style:none;}
.weather-days::-webkit-scrollbar{display:none;}
.weather-day-card{flex:0 0 64px;text-align:center;padding:12px 4px;border-radius:12px;border:1px solid var(--card-border);}
.weather-day-card .day{font-size:11px;color:var(--text-sub);margin-bottom:8px;}
.weather-day-card .hi{font-size:13px;font-weight:600;color:var(--text-main);}
.weather-day-card .lo{font-size:11px;color:var(--text-sub);margin-top:4px;}
.weather-advice{margin-top:20px;padding:16px;background:var(--accent-soft);border-radius:12px;font-size:13px;color:var(--text-sub);text-align:center;line-height:1.6;}

/* 页脚 */
.footer{padding:28px 0 20px;text-align:center;color:var(--text-sub);opacity:.55;}
.footer .ver{font-size:11px;letter-spacing:1.5px;font-family:'Iowan Old Style',Georgia,serif;}
.footer .coming{font-size:11px;letter-spacing:2px;margin-top:6px;font-family:'Iowan Old Style',Georgia,serif;font-style:italic;}

@media(max-width:768px){
  body{overflow:auto;}
  .app{height:auto;padding-bottom:20px;}
  .grid{grid-template-columns:1fr;grid-template-rows:auto;grid-auto-rows:minmax(100px,auto);flex:none;min-height:0;}
  .grid-item{grid-column:1 !important;grid-row:auto !important;min-height:100px;}
  .top-bar{flex-direction:column;align-items:flex-start;gap:10px;}
  .top-right{width:100%;}
  .top-bar h1{font-size:22px;}
  .top-bar .signature{font-size:15px;margin-top:8px;}
  .popup-header{padding:18px 20px 12px;}
  #popupContent{padding:0 20px 20px;}
  .popup-box::after{display:none;}
  .quote-text{font-size:20px;}
  .pomo-display{font-size:40px;width:140px;}
  .flip-digit{width:44px;height:64px;font-size:40px;}
  .calc-screen{font-size:26px;}
  .weather-temp{font-size:30px;}
  .weather-grid{grid-template-columns:repeat(2,1fr);}
  .mind-container{height:380px;}
}

/* ============ 主题切换过渡 ============ */
body.theme-transition,
body.theme-transition *,
body.theme-transition *::before,
body.theme-transition *::after{
  transition-property:background, background-color, color, border-color, box-shadow, fill, stroke, opacity !important;
  transition-duration:.45s !important;
  transition-timing-function:ease !important;
  transition-delay:0s !important;
}
</style>
</head>
<body>

      <div class="card-header"><span class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a3 3 0 0 0-6 0v.5A3.5 3.5 0 0 0 3 8c0 1.6 1 2.9 2.4 3.4A3 3 0 0 0 6 17.5 3 3 0 0 0 9 21a3 3 0 0 0 3-3V4z"/><path d="M12 4a3 3 0 0 1 6 0v.5A3.5 3.5 0 0 1 21 8c0 1.6-1 2.9-2.4 3.4A3 3 0 0 1 18 17.5 3 3 0 0 1 15 21a3 3 0 0 1-3-3V4z"/></svg></span><span>测试中心</span></div>

    <div class="grid-item card-pomo" data-module="pomo">

    <div class="grid-item card-calc" data-module="calc">
      <div class="card-header"><span class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8"/><path d="M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></svg></span><span>计算</span></div>
      <div class="card-body">公式 · 函数 · 单位换算</div>
    </div>

    <div class="grid-item card-pwd" data-module="pwd">
      <div class="card-header"><span class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span>密码</span></div>
      <div class="card-body">随机强密码</div>

    <div class="grid-item card-memo" data-module="memo">
      <div class="card-header"><span class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11l5-5V5a2 2 0 0 0-2-2Z"/><path d="M15 21v-4a2 2 0 0 1 2-2h4"/></svg></span><span>便签</span></div>

      <div class="card-header"><span class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg></span><span>思维导图</span></div>
      <div class="card-body">点击生长的树</div>
    </div>

    <div class="grid-item card-count" data-module="countdown">
      <div class="card-header"><span class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.17a2 2 0 0 0-.59-1.42L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22"/><path d="M7 2v4.17a2 2 0 0 0 .59 1.42L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"/></svg></span><span>纪念日</span></div>

    <div class="grid-item card-cal" data-module="calendar">
      <div class="card-header"><span class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span><span>日历</span></div>

      <div class="card-body">10+ 工具 · 编解码 · 备份</div>

  <div class="footer">

</div>

<div class="dynamic-island" id="dynamicIsland">

<div class="popup-overlay" id="popupOverlay">

</div>

<input type="file" id="fileInput" accept="image/*" style="display:none;">
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

var presetBackgrounds = ['1.jpg','2.jpg','3.jpg','4.jpg','5.jpg','6.jpg','7.jpg','8.jpg','9.jpg','10.jpg'];
var WEATHER_CITY = '北京', WEATHER_LAT = 39.9042, WEATHER_LON = 116.4074;
var VERSION = '3.7.2';

var currentMode = 'color', colorTheme = 'light', presetIndex = -1, userBgBlob = null;
var bgCache = {};

function $(id){ return document.getElementById(id); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

var toastEl = $('toast'), toastTimer = null;
function showToast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2000); }
function copyText(t){
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ showToast('已复制'); }).catch(function(){ showToast('复制失败'); }); }
  else { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); showToast('已复制'); } catch(e){} document.body.removeChild(ta); }
}

/* IndexedDB */
var DB_NAME = 'larryWorkbench', DB_VERSION = 1, STORE = 'backgrounds';
function openDB(){ return new Promise(function(res, rej){ try { var req = indexedDB.open(DB_NAME, DB_VERSION); req.onupgradeneeded = function(e){ var db = e.target.result; if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, {keyPath:'id'}); }; req.onsuccess = function(e){ res(e.target.result); }; req.onerror = function(e){ rej(e.target.error); }; } catch(err){ rej(err); } }); }
function saveBgToDB(blob){ return openDB().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put({id:'userBg', data: blob, ts: Date.now()}); tx.oncomplete = function(){ res(); }; tx.onerror = function(e){ rej(e.target.error); }; }); }); }
function loadBgFromDB(){ return openDB().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction(STORE,'readonly'); var req = tx.objectStore(STORE).get('userBg'); req.onsuccess = function(){ res(req.result ? req.result.data : null); }; req.onerror = function(e){ rej(e.target.error); }; }); }).catch(function(){ return null; }); }
function compressImage(file, maxW, q){ maxW = maxW || 1920; q = q || 0.85; return new Promise(function(res, rej){ var img = new Image(); var url = URL.createObjectURL(file); img.onload = function(){ var w = img.width, h = img.height; if (w > maxW){ h = Math.round(h * maxW / w); w = maxW; } var c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); c.toBlob(function(blob){ blob ? res(blob) : rej(new Error('压缩失败')); }, 'image/jpeg', q); }; img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('加载失败')); }; img.src = url; }); }

/* 背景层 */
var bgLayer = $('bgLayer'), currentBlobUrl = null;
function setBgFromUrl(url){
  if (currentBlobUrl){ URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
  var src = (typeof bgCache !== 'undefined' && bgCache[url]) ? bgCache[url] : url;
  bgLayer.style.backgroundImage = 'url("' + src + '")';
  bgLayer.classList.add('active');}
function setBgFromBlob(blob){ if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = URL.createObjectURL(blob); bgLayer.style.backgroundImage = 'url("' + currentBlobUrl + '")'; bgLayer.classList.add('active'); }
function clearBgImage(){ if (currentBlobUrl){ URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; } bgLayer.style.backgroundImage = ''; bgLayer.classList.remove('active'); }

/* 日期 */
var dateBadge = $('dateBadge'), isLunar = false;
var weekdayCN = ['日','一','二','三','四','五','六'];
var lunarFormatter = null;
try { lunarFormatter = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { year:'numeric', month:'long', day:'numeric', weekday:'short' }); } catch(e){ lunarFormatter = null; }
function lunarMonthCN(n){ var m = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月']; return m[(n-1)%12] || (n+'月'); }
function lunarDayCN(n){ var d = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十']; return d[(n-1)%30] || (n+''); }
function formatSolar(date){ return date.getFullYear() + '.' + (date.getMonth()+1) + '.' + date.getDate() + ' 星期' + weekdayCN[date.getDay()]; }
function formatLunar(date){ if (!lunarFormatter) return formatSolar(date); try { var s = lunarFormatter.format(date).replace(/^\d{4}/,'').trim(); s = s.replace(/(\d+)\s*月/g, function(_, n){ return lunarMonthCN(parseInt(n,10)); }); s = s.replace(/月\s*(\d+)/g, function(_, n){ return '月' + lunarDayCN(parseInt(n,10)); }); s = s.replace(/(周[日一二三四五六])/g, ' $1'); return s; } catch(e){ return formatSolar(date); } }
function updateDateDisplay(){ var now = new Date(); dateBadge.textContent = isLunar ? formatLunar(now) : formatSolar(now); }
dateBadge.addEventListener('click', function(){ isLunar = !isLunar; updateDateDisplay(); });
updateDateDisplay();

/* 问候语 + 时间 */
function updateGreeting(){
  var now = new Date();
  var h = now.getHours();
  var m = now.getMinutes();
  var greet;
  if (h >= 5 && h < 9) greet = '早上好';
  else if (h >= 9 && h < 12) greet = '上午好';
  else if (h >= 12 && h < 14) greet = '中午好';
  else if (h >= 14 && h < 18) greet = '下午好';
  else if (h >= 18 && h < 23) greet = '晚上好';
  else greet = '夜深了';
  var gt = document.getElementById('greetText');
  var gm = document.getElementById('greetTime');
  if (gt) gt.textContent = greet;
  if (gm) gm.textContent = (h<10?'0':'')+h + ':' + (m<10?'0':'')+m;
}
updateGreeting();
setInterval(updateGreeting, 10000);

/* 模式切换 */
var modeSegment = $('modeSegment'), segItems = modeSegment.querySelectorAll('.seg-item'), subToggle = $('subToggle');
var themeTransitionTimer = null;
function triggerThemeTransition(){
  document.body.classList.add('theme-transition');
  clearTimeout(themeTransitionTimer);
  themeTransitionTimer = setTimeout(function(){
    document.body.classList.remove('theme-transition');
  }, 500);
}
function setMode(mode){
  triggerThemeTransition();
  currentMode = mode;
  segItems.forEach(function(it){ it.classList.toggle('active', it.getAttribute('data-mode')===mode); });
  applyState();
}
segItems.forEach(function(it){ it.addEventListener('click', function(){ var m = it.getAttribute('data-mode'); if (m !== currentMode) setMode(m); }); });
subToggle.addEventListener('click', function(){
  triggerThemeTransition();
  if (currentMode === 'color'){
    colorTheme = colorTheme === 'light' ? 'dark' : 'light';
    applyState();
  } else {
    if (!presetBackgrounds.length){ showToast('没有预设背景图'); return; }
    presetIndex = (presetIndex + 1) % presetBackgrounds.length;
    setBgFromUrl(presetBackgrounds[presetIndex]);
    applyState();
  }
});
function applyState(){
  if (currentMode === 'color'){ document.body.classList.remove('image-mode'); document.body.classList.toggle('dark-mode', colorTheme === 'dark'); clearBgImage(); subToggle.textContent = colorTheme === 'light' ? '浅色' : '深色'; }
  else { document.body.classList.add('image-mode'); document.body.classList.remove('dark-mode'); if (!bgLayer.style.backgroundImage || bgLayer.style.backgroundImage === 'none'){ if (userBgBlob) setBgFromBlob(userBgBlob); else if (presetBackgrounds.length){ presetIndex = 0; setBgFromUrl(presetBackgrounds[0]); } } bgLayer.classList.add('active'); subToggle.textContent = '换景'; }
}

/* 导入图片 */
var importBtn = $('importBtn'), fileInput = $('fileInput'), dynamicIsland = $('dynamicIsland'), islandBtn = $('islandBtn');
var isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0, islandTimer = null;
function showIsland(){ dynamicIsland.classList.add('show'); clearTimeout(islandTimer); islandTimer = setTimeout(function(){ dynamicIsland.classList.remove('show'); }, 6000); }
function hideIsland(){ dynamicIsland.classList.remove('show'); clearTimeout(islandTimer); }
importBtn.addEventListener('click', function(e){ if (isTouch){ e.stopPropagation(); dynamicIsland.classList.contains('show') ? hideIsland() : showIsland(); } else fileInput.click(); });
islandBtn.addEventListener('click', function(e){ e.stopPropagation(); hideIsland(); fileInput.click(); });
document.addEventListener('click', function(e){ if (dynamicIsland.classList.contains('show') && !dynamicIsland.contains(e.target) && !importBtn.contains(e.target)) hideIsland(); });
fileInput.addEventListener('change', function(e){
  var file = e.target.files && e.target.files[0]; if (!file) return;
  if (!file.type || file.type.indexOf('image/') !== 0){ showToast('请选择图片'); return; }
  showToast('正在处理...');
  compressImage(file, 1920, .85).then(function(blob){ return saveBgToDB(blob).then(function(){ return blob; }); }).then(function(blob){ userBgBlob = blob; setBgFromBlob(blob); if (currentMode !== 'image') setMode('image'); else applyState(); showToast('已保存到本设备'); }).catch(function(){ try { userBgBlob = file; setBgFromBlob(file); setMode('image'); showToast('已应用'); } catch(err){ showToast('处理失败'); } });
  fileInput.value = '';
});
/* PWA 安装 */
var installBtn = $('installBtn'), deferredPrompt = null;
function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
         window.navigator.standalone === true;
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}
if (installBtn && !isStandalone()){
  if (isIOS()){
    // iOS Safari 不支持 beforeinstallprompt，改为引导
    installBtn.style.display = '';
    installBtn.addEventListener('click', function(){
      openPopup('添加到主屏幕',
        '<div style="font-size:14px;line-height:2.1;color:var(--text-main);padding:8px 0;">' +
          '<p>1. 点击底部中央的 <b>分享按钮</b> ⬆️</p>' +

function weatherText(code){ if (code === 0) return '晴'; if (code === 1) return '基本晴'; if (code === 2) return '部分多云'; if (code === 3) return '阴'; if (code === 45 || code === 48) return '雾'; if (code >= 51 && code <= 57) return '毛毛雨'; if (code >= 61 && code <= 67) return '雨'; if (code >= 71 && code <= 77) return '雪'; if (code >= 80 && code <= 82) return '阵雨'; if (code >= 85 && code <= 86) return '阵雪'; if (code >= 95 && code <= 99) return '雷雨'; return '—'; }

function weatherAdvice(c){ var t = c.temperature_2m, code = c.weather_code, hum = c.relative_humidity_2m; var tips = []; if (code >= 61 && code <= 67) tips.push('出门记得带伞'); if (code >= 71 && code <= 77) tips.push('路面湿滑，注意保暖'); if (code >= 95 && code <= 99) tips.push('雷雨天气，减少外出'); if (t >= 30) tips.push('高温，注意补水防暑'); if (t <= 5) tips.push('寒冷，穿厚一点'); if (hum >= 80) tips.push('湿度较高，注意通风'); if (hum <= 30) tips.push('空气干燥，多喝水'); if (!tips.length) tips.push('天气不错，保持好心情'); return '今日建议 · ' + tips.join(' · '); }

/* ========== 天气缓存（30 分钟） ========== */
var WEATHER_CACHE_KEY = 'larryWeatherCache';
var WEATHER_CACHE_TTL = 30 * 60 * 1000;

function readWeatherCache(){
  try {
    var raw = localStorage.getItem(WEATHER_CACHE_KEY);
    if (!raw) return null;
    var c = JSON.parse(raw);
    if (!c || !c.ts || !c.data) return null;
    if (Date.now() - c.ts > WEATHER_CACHE_TTL) return null;
    return c.data;
  } catch(e){ return null; }
}
function writeWeatherCache(data){
  try {
    localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ ts: Date.now(), data: data }));
  } catch(e){}
}
function applyWeatherData(d){
  weatherData = d.current;
  weatherDaily = d.daily;
  weatherAir = d.air;
  renderWeatherCard();
  if (popupOverlay.classList.contains('show') && popupTitle.textContent === '天气'){
    showWeatherPopup();
  }
}

function loadWeather(){
  var cached = readWeatherCache();
  if (cached){
    applyWeatherData(cached);
    return;
  }
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + WEATHER_LAT + '&longitude=' + WEATHER_LON + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,visibility&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_sum&timezone=auto&forecast_days=7';
  var airUrl = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + WEATHER_LAT + '&longitude=' + WEATHER_LON + '&current=european_aqi&timezone=auto';
  Promise.all([
    fetch(url).then(function(r){ return r.json(); }),
    fetch(airUrl).then(function(r){ return r.json(); }).catch(function(){ return null; })
  ]).then(function(results){
    var d = results[0], aq = results[1];
    if (!d || !d.current) throw new Error('数据错误');
    var bundle = {
      current: d.current,
      daily: d.daily,
      air: (aq && aq.current) ? aq.current : null
    };
    writeWeatherCache(bundle);
    applyWeatherData(bundle);
  }).catch(function(){
    try {
      var raw = localStorage.getItem(WEATHER_CACHE_KEY);
      if (raw){
        var c = JSON.parse(raw);
        if (c && c.data){ applyWeatherData(c.data); return; }
      }
    } catch(e){}
    var sk = $('weatherSkeleton');
    var real = $('weatherReal');
    if (sk) sk.style.display = 'none';
    if (real) real.classList.add('show');
    $('weatherTemp').textContent = '--°';
    $('weatherDesc').textContent = '暂无数据';
  });
}
function renderWeatherCard(){
  if (!weatherData) return;
  $('weatherTemp').textContent = Math.round(weatherData.temperature_2m) + '°';
  $('weatherDesc').textContent = weatherText(weatherData.weather_code);
  $('weatherCity').textContent = WEATHER_CITY;
  var sk = $('weatherSkeleton');
  var real = $('weatherReal');
  if (sk) sk.style.display = 'none';
  if (real) real.classList.add('show');
}
function showWeatherPopup(){
  if (!weatherData){ openPopup('天气', '<div style="text-align:center;padding:30px;color:var(--text-sub);">加载中...</div>'); return; }
  var c = weatherData, d = weatherDaily, aq = weatherAir;
  var html = '<div style="text-align:center;padding:8px 0 24px;">' +
    '<div style="font-size:76px;font-weight:200;letter-spacing:-3px;line-height:1;font-family:\'SF Mono\',\'Cascadia Mono\',Consolas,Menlo,monospace;font-variant-numeric:tabular-nums;">' + Math.round(c.temperature_2m) + '°</div>' +
    '<div style="font-size:15px;color:var(--text-sub);margin-top:12px;letter-spacing:1px;">' + weatherText(c.weather_code) + ' · ' + WEATHER_CITY + '</div>' +
    '<div style="font-size:12px;color:var(--text-sub);margin-top:4px;opacity:.7;">体感 ' + Math.round(c.apparent_temperature) + '°</div></div>';
  var gridItems = [
    {label:'湿度', value: c.relative_humidity_2m + '%'},
    {label:'风速', value: c.wind_speed_10m + ' km/h'},
    {label:'气压', value: Math.round(c.pressure_msl) + ' hPa'},
    {label:'能见度', value: (c.visibility/1000).toFixed(1) + ' km'},
    {label:'云量', value: c.cloud_cover + '%'},
    {label:'降雨', value: c.precipitation + ' mm'},
    {label:'紫外线', value: d ? Math.round(d.uv_index_max[0]) : '—'},
    {label:'空气', value: aq ? aqiText(aq.european_aqi) : '—'}
  ];
  html += '<div class="weather-grid">';
  gridItems.forEach(function(it){ html += '<div class="weather-grid-item"><div class="val">' + it.value + '</div><div class="lbl">' + it.label + '</div></div>'; });
  html += '</div>';
  if (d && d.time){
    var weekCN = ['日','一','二','三','四','五','六'];
    html += '<div style="margin-top:20px;"><div style="font-size:12px;color:var(--text-sub);margin-bottom:12px;letter-spacing:1px;">未来 7 天</div><div class="weather-days" id="weatherDaysScroll">';
    for (var i = 0; i < d.time.length; i++){
      var date = new Date(d.time[i] + 'T00:00:00');
      var label = i === 0 ? '今天' : '周' + weekCN[date.getDay()];
      html += '<div class="weather-day-card"><div class="day">' + label + '</div><div class="hi">' + Math.round(d.temperature_2m_max[i]) + '°</div><div class="lo">' + Math.round(d.temperature_2m_min[i]) + '°</div></div>';
    }
    html += '</div></div>';
  }
  html += '<div class="weather-advice">' + weatherAdvice(c) + '</div>';
  openPopup('天气', html);
  var wd = $('weatherDaysScroll');
  if (wd){ wd.addEventListener('wheel', function(e){ if (e.deltaY !== 0){ e.preventDefault(); wd.scrollLeft += e.deltaY; } }, { passive: false }); }
}

var quotesList = null, BAG_KEY = 'larryQuoteBag', quoteBag = [];
function loadQuotes(){ return fetch('quotes.json').then(function(r){ if (!r.ok) throw new Error('无 quotes.json'); return r.json(); }).then(function(data){ if (Array.isArray(data) && data.length) quotesList = data; else quotesList = fallbackQuotes; }).catch(function(){ quotesList = fallbackQuotes; }); }
function refillQuoteBag(){ quoteBag = []; for (var i = 0; i < quotesList.length; i++) quoteBag.push(i); for (var j = quoteBag.length - 1; j > 0; j--){ var k = Math.floor(Math.random() * (j + 1)); var tmp = quoteBag[j]; quoteBag[j] = quoteBag[k]; quoteBag[k] = tmp; } saveBag(); }
function saveBag(){ try { localStorage.setItem(BAG_KEY, JSON.stringify({ bag: quoteBag, total: quotesList ? quotesList.length : 0, ts: Date.now() })); } catch(e){} }
function getNextQuote(){
  if (!quotesList || !quotesList.length) return null;
  var stored = null;
  try { stored = JSON.parse(localStorage.getItem(BAG_KEY) || 'null'); } catch(e){}
  if (!stored || stored.total !== quotesList.length){ try { localStorage.removeItem(BAG_KEY); } catch(e){} quoteBag = []; }
  else if (quoteBag.length === 0){ quoteBag = stored.bag || []; }
  if (quoteBag.length === 0) refillQuoteBag();
  var idx = quoteBag.pop(); saveBag(); return quotesList[idx];
}
function wrapQuote(text){
  var hasCJK = /[\u4e00-\u9fa5]/.test(text);
  var hasLatin = /[A-Za-z\u0400-\u04FF]/.test(text);
  if (hasCJK && !hasLatin) return '<span class="cn">' + escapeHtml(text) + '</span>';
  return escapeHtml(text);
}
function renderQuote(){
  var q = getNextQuote(); if (!q) return;
  var html = '<div style="text-align:center;padding:30px 16px 20px;">' +
    '<div class="quote-text" id="quoteClickArea" style="cursor:pointer;">' + wrapQuote(q.text) + '</div>';
  if (q.trans) html += '<div class="quote-trans">' + wrapQuote(q.trans) + '</div>';
  if (q.source) html += '<div class="quote-source">——《' + escapeHtml(q.source) + '》</div>';
  html += '<div class="quote-hint">点击句子换下一句</div>';
  html += '<div style="margin-top:28px;display:flex;gap:8px;justify-content:center;">' +
    '<button class="btn-secondary" id="quoteCopy">复制</button><button class="btn-secondary" id="quoteNext">换一句</button></div></div>';
  popupContent.innerHTML = html;
  $('quoteClickArea').addEventListener('click', renderQuote);
  $('quoteCopy').addEventListener('click', function(){ var txt = q.text; if (q.trans) txt += '\n' + q.trans; if (q.source) txt += '\n——《' + q.source + '》'; copyText(txt); });
  $('quoteNext').addEventListener('click', renderQuote);
}
function showQuotesPopup(){
  if (!quotesList){ loadQuotes().then(function(){ openPopup('日常文案', ''); renderQuote(); }); }
  else { openPopup('日常文案', ''); renderQuote(); }
}

    '<input type="text" class="input-field" id="todoInput" placeholder="添加待办...">' +

    html += '<div class="todo-list">';

      html += '<div class="todo-item">' +

    });

  }

  var input = $('todoInput'), addBtn = $('todoAdd');

  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') add(); });
  input.focus();

    el.addEventListener('click', function(){
      var i = parseInt(el.getAttribute('data-i'), 10), act = el.getAttribute('data-act'), list = loadTodos();
      if (act === 'toggle') list[i].done = !list[i].done;
      else if (act === 'del') list.splice(i, 1);
      saveTodos(list); renderTodos();
    });
  });
}

var currentTest = null, currentTestIdx = 0, currentTestAns = [];

function showTestsMenu(){
  var html = '<div class="test-menu">';
  Object.keys(tests).forEach(function(k){
    var t = tests[k];
    html += '<div class="test-menu-item" data-test="' + k + '">' +
      '<div><div class="name">' + t.name + '</div><div class="desc">' + t.desc + '</div></div>' +
      '<div class="arrow">›</div></div>';
  });
  html += '</div>';
  openPopup('测试中心', html);
  popupContent.querySelectorAll('[data-test]').forEach(function(el){
    el.addEventListener('click', function(){
      currentTest = tests[el.getAttribute('data-test')];
      currentTestIdx = 0;
      currentTestAns = [];
      renderTestQuestion();
    });
  });
}

function renderTestQuestion(){
  if (!currentTest) return;
  var q = currentTest.questions[currentTestIdx];
  var total = currentTest.questions.length;
  var progress = (currentTestIdx / total) * 100;
  var html = '<div class="test-progress"><div class="test-progress-fill" style="width:' + progress + '%"></div></div>';
  html += '<div class="test-q-title">' + (currentTestIdx+1) + '/' + total + ' · ' + escapeHtml(q.t) + '</div><div>';
  q.o.forEach(function(opt, idx){
    var sel = currentTestAns[currentTestIdx] === idx ? ' selected' : '';
    html += '<div class="test-opt' + sel + '" data-idx="' + idx + '">' +
      '<span class="opt-mark"></span><span>' + escapeHtml(opt) + '</span></div>';
  });
  html += '</div><div class="test-nav">';
  if (currentTestIdx > 0) html += '<button class="btn-secondary" id="testPrev">上一题</button>';
  if (currentTestAns[currentTestIdx] != null){
    if (currentTestIdx < total - 1) html += '<button class="btn-primary" id="testNext" style="flex:1;">下一题</button>';
    else html += '<button class="btn-primary" id="testFinish" style="flex:1;">查看结果</button>';
  }
  html += '<span class="test-step">' + (currentTestIdx+1) + ' / ' + total + '</span></div>';
  popupContent.innerHTML = html;

  popupContent.querySelectorAll('[data-idx]').forEach(function(el){
    el.addEventListener('click', function(){
      var idx = parseInt(el.getAttribute('data-idx'), 10);
      currentTestAns[currentTestIdx] = idx;
      if (currentTestIdx < currentTest.questions.length - 1){
        setTimeout(function(){ currentTestIdx++; renderTestQuestion(); }, 260);
      } else {
        renderTestQuestion();
      }
    });
  });
  var prev = $('testPrev'); if (prev) prev.addEventListener('click', function(){ currentTestIdx--; renderTestQuestion(); });
  var next = $('testNext'); if (next) next.addEventListener('click', function(){ currentTestIdx++; renderTestQuestion(); });
  var fin = $('testFinish'); if (fin) fin.addEventListener('click', finishTest);
}

/* ============ 报告生成 ============ */
function barHTML(leftLabel, rightLabel, leftPct){
  var l = Math.round(leftPct), r = 100 - l;
  return '<div class="report-bar-item">' +
    '<div class="report-bar-label">' +
      '<span class="' + (l >= r ? 'on' : '') + '">' + leftLabel + '</span>' +
      '<span class="' + (r > l ? 'on' : '') + '">' + rightLabel + '</span>' +
    '</div>' +
    '<div class="report-bar-track"><div class="report-bar-left" style="width:' + l + '%"></div></div>' +
    '<div class="report-bar-num"><span>' + l + '%</span><span>' + r + '%</span></div>' +
  '</div>';
}
function tagHTML(t){ return '<span class="report-tag">' + t + '</span>'; }
function sectionHTML(title, body){ return '<div class="report-section"><div class="report-section-title">' + title + '</div>' + body + '</div>'; }
function listHTML(items){ return '<ul class="report-list">' + items.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>'; }

function reportMBTI(res){
  var c = res.cnt;
  var info = MBTI_INFO[res.mbti] || {tag:'探索者', line:'', body:''};
  var typeStr = res.mbti;
  var eP = Math.round(c.E / Math.max(1, c.E + c.I) * 100);
  var nP = Math.round(c.N / Math.max(1, c.N + c.S) * 100);
  var fP = Math.round(c.F / Math.max(1, c.F + c.T) * 100);
  var pP = Math.round(c.P / Math.max(1, c.P + c.J) * 100);

  var html = '<div class="report-head">' +
    '<div class="report-badge">TEST REPORT</div>' +
    '<div class="report-main-title">' + typeStr + ' · ' + info.tag + '</div>' +
    '<div class="report-subtitle">' + info.line + '</div>' +
    '<div class="report-tags">' + tagHTML((eP < 50 ? '内向 ' + Math.round(100-eP) : '外向 ' + eP) + '%') + '</div>' +
  '</div>';

  html += sectionHTML('维度倾向',
    barHTML('外向 E', '内向 I', 100 - eP) +
    barHTML('实感 S', '直觉 N', nP) +
    barHTML('思考 T', '情感 F', fP) +
    barHTML('判断 J', '感知 P', pP)
  );

  html += sectionHTML('核心描述', '<p class="report-text">' + info.body + '</p>');

  var adv = [
    DIM_ADV[typeStr[0]], DIM_ADV[typeStr[1]], DIM_ADV[typeStr[2]], DIM_ADV[typeStr[3]]
  ];
  html += sectionHTML('你的优势', listHTML(adv));

  var blind = [
    DIM_BLIND[typeStr[0]], DIM_BLIND[typeStr[1]], DIM_BLIND[typeStr[2]], DIM_BLIND[typeStr[3]]
  ];
  html += sectionHTML('可能的盲点', listHTML(blind));

  html += sectionHTML('关系与成长',
    '<p class="report-text">与你相处，需要一点耐心去理解你的"内在逻辑"；一旦被信任，你就是那种可以长期并肩的人。</p>' +
    '<p class="report-text">如果想让关系更顺，试着在表达判断之前，先说一句感受——这会让别人更容易靠近你。</p>'
  );

  html += '<div class="report-foot">LARRY WORKBENCH · MBTI</div>';
  html += '<div class="report-disclaimer">本测试基于自我报告，仅供自我了解参考，不代表科学诊断。</div>';
  return html;
}

function reportMood(res){
  var dims = res.dims;
  var overall = 0, n = 0;
  Object.keys(dims).forEach(function(k){ overall += dims[k].pct; n++; });
  overall = n ? Math.round(overall / n) : 0;

  var level, line;
  if (overall >= 80) { level = '状态良好'; line = '你目前的状态比较平衡，请继续保持这份节奏。'; }
  else if (overall >= 60) { level = '总体平稳'; line = '整体不错，但某些方面需要一点关照。'; }

  '</div>';

  var dimBars = '';
  Object.keys(dims).forEach(function(k){
    var d = dims[k];
    dimBars += barHTML(d.name, '', d.pct);
  });
  html += sectionHTML('六维扫描', dimBars);

  var lowDims = [];
  Object.keys(dims).forEach(function(k){

  });

function reportIQ(res){
  var score = res.score, total = res.total;
  var level = score >= 17 ? '卓越' : score >= 14 ? '优秀' : score >= 11 ? '良好' : score >= 8 ? '中等' : '基础';
  var line = score >= 17 ? '思维敏捷，逻辑与推理能力出色。' :
             score >= 14 ? '认知稳健，抽象与逻辑表现都很好。' :
             score >= 11 ? '整体认知均衡，逻辑清晰。' :
             score >= 8  ? '基础稳固，某些类型可以针对性提升。' :
                           '这份测试更像是认知风格的一个切面，分数不代表你的全部。';

  var html = '<div class="report-head">' +
    '<div class="report-badge">COGNITIVE REPORT</div>' +
    '<div class="report-main-title">' + level + '</div>' +
    '<div class="report-subtitle">' + line + '</div>' +
  '</div>';

  html += '<div class="report-score-big">' +
    '<div><span class="report-score-num">' + score + '</span><span class="report-score-total">/ ' + total + '</span></div>' +
    '<div class="report-score-label">正 确 率 ' + Math.round(score/total*100) + '%</div>' +
  '</div>';

  var catStats = res.catStats;
  var grid = '<div class="report-grid">';
  Object.keys(catStats).forEach(function(cat){
    var s = catStats[cat];
    var pct = Math.round(s.correct / s.total * 100);
    grid += '<div class="report-grid-item">' +
      '<div class="lbl">' + cat + '推理</div>' +
      '<div class="val">' + s.correct + '/' + s.total + '</div>' +
      '<div class="sub">正确率 ' + pct + '%</div>' +
    '</div>';
  });
  grid += '</div>';
  html += sectionHTML('分项表现', grid);

  var best = null, worst = null;
  Object.keys(catStats).forEach(function(cat){
    var s = catStats[cat];
    var pct = s.correct / s.total * 100;
    if (!best || pct > best.pct) best = {cat: cat, pct: pct};
    if (!worst || pct < worst.pct) worst = {cat: cat, pct: pct};
  });

  if (best && worst && best.cat !== worst.cat){
    html += sectionHTML('强项与可提升空间',
      listHTML([
        '<b>' + best.cat + '</b> 是你表现最好的一类（' + Math.round(best.pct) + '%）——' + catComment(best.cat, true),
        '<b>' + worst.cat + '</b> 相对弱一些（' + Math.round(worst.pct) + '%）——' + catComment(worst.cat, false)
      ])
    );
  }

  html += '<div class="report-foot">LARRY WORKBENCH · IQ</div>';
  html += '<div class="report-disclaimer">智力是多维的，无法用单一分数定义。本测试仅作娱乐与自我观察。</div>';
  return html;
}

function catComment(cat, good){
  var map = {
    '数列': good ? '你善于捕捉数字间的规律与递推关系。' : '可以试着从差值、倍数、平方等常见规律切入。',
    '逻辑': good ? '你处理条件推理的能力不错，能从前提中得出结论。' : '多注意"全部/有些"这类量词的差别，结论会更严谨。',
    '空间': good ? '你对空间与图形的直觉较好。' : '平时可以多做一些折纸、拼图的思维训练。',
    '数学': good ? '你的基础数学能力扎实。' : '慢一点、看清单位与关系，正确率会明显提升。',
    '常识': good ? '生活常识很稳。' : '多留意日常细节，很多答案其实就在身边。'
  };
  return map[cat] || '';
}

function finishTest(){
  var name = currentTest.name;
  var qs = currentTest.questions;
  var ans = currentTestAns;
  var res;

  if (currentTest.type === 'mbti'){
    var cnt = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
    ans.forEach(function(idx, i){
      if (idx == null) return;
      var s = qs[i].scores[idx]; if (!s) return;
      Object.keys(s).forEach(function(k){ cnt[k] += s[k]; });
    });
    var type = (cnt.E >= cnt.I ? 'E' : 'I') + (cnt.S >= cnt.N ? 'S' : 'N') + (cnt.T >= cnt.F ? 'T' : 'F') + (cnt.J >= cnt.P ? 'J' : 'P');
    res = {mbti: type, cnt: cnt};
  }
  else if (currentTest.type === 'mood'){
    var dims = {};
    ans.forEach(function(idx, i){
      if (idx == null) return;
      var q = qs[i];
      var sc = q.scores[idx] != null ? q.scores[idx] : 0;
      if (!dims[q.cat]) dims[q.cat] = {got: 0, max: 0};
      dims[q.cat].got += sc;
      dims[q.cat].max += Math.max.apply(null, q.scores);
    });
    var pctDims = {};
    Object.keys(dims).forEach(function(k){
      pctDims[k] = {
        name: MOOD_DIM[k] ? MOOD_DIM[k].name : k,
        pct: Math.round(dims[k].got / Math.max(1, dims[k].max) * 100)
      };
    });
    res = {dims: pctDims};
  }
  else if (currentTest.type === 'iq'){
    var score = 0;
    var catStats = {};
    ans.forEach(function(idx, i){
      var q = qs[i];
      if (!catStats[q.cat]) catStats[q.cat] = {correct: 0, total: 0};
      catStats[q.cat].total++;
      if (idx === q.ans){ score++; catStats[q.cat].correct++; }
    });
    res = {score: score, total: qs.length, catStats: catStats};
  }
  else if (currentTest.type === 'friend'){
    var count = {};
    ans.forEach(function(idx, i){
      if (idx == null) return;
      var t = qs[i].tags[idx]; if (!t) return;
      count[t] = (count[t] || 0) + 1;
    });
    var top = Object.keys(count).sort(function(a,b){ return count[b] - count[a]; }).slice(0, 3);
    if (!top.length) top = ['warm','calm','rational'];
    res = {top: top, count: count};
  }

  var reportHTML = '<div class="test-report">';
  if (currentTest.type === 'mbti') reportHTML += reportMBTI(res);
  else if (currentTest.type === 'mood') reportHTML += reportMood(res);
  else if (currentTest.type === 'iq') reportHTML += reportIQ(res);
  else if (currentTest.type === 'friend') reportHTML += reportFriend(res);
  reportHTML += '</div>';
  reportHTML += '<div style="display:flex;gap:8px;margin-top:18px;">' +
    '<button class="btn-secondary" id="reportCopy" style="flex:1;">复制关键结果</button>' +
    '<button class="btn-primary" id="reportBack" style="flex:1;">返回测试中心</button>' +
  '</div>';

  popupContent.innerHTML = reportHTML;

  $('reportCopy').addEventListener('click', function(){
    var txt = '【' + name + '】\n' + reportPlainText(currentTest.type, res) + '\n—— Larry 工作台 v' + VERSION;
    copyText(txt);
  });
  $('reportBack').addEventListener('click', showTestsMenu);
}

function reportPlainText(type, res){
  if (type === 'mbti'){
    var c = res.cnt;
    var i1 = Math.round(c.I / Math.max(1, c.E + c.I) * 100);
    var n1 = Math.round(c.N / Math.max(1, c.N + c.S) * 100);
    var f1 = Math.round(c.F / Math.max(1, c.F + c.T) * 100);
    var p1 = Math.round(c.P / Math.max(1, c.P + c.J) * 100);
    var info = MBTI_INFO[res.mbti];
    return res.mbti + ' · ' + info.tag + '\n' + info.line + '\n' +
      '内向 I ' + i1 + '% / 外向 E ' + (100-i1) + '%\n' +
      '直觉 N ' + n1 + '% / 实感 S ' + (100-n1) + '%\n' +
      '情感 F ' + f1 + '% / 思考 T ' + (100-f1) + '%\n' +
      '感知 P ' + p1 + '% / 判断 J ' + (100-p1) + '%';
  }
  if (type === 'mood'){
    var lines = [];
    var overall = 0, n = 0;
    Object.keys(res.dims).forEach(function(k){
      lines.push(res.dims[k].name + ' ' + res.dims[k].pct + '%');
      overall += res.dims[k].pct; n++;
    });
    return '综合状态 ' + Math.round(overall/Math.max(1,n)) + ' / 100\n' + lines.join('\n');
  }
  if (type === 'iq'){
    var lines = ['得分 ' + res.score + ' / ' + res.total + '（' + Math.round(res.score/res.total*100) + '%）'];
    Object.keys(res.catStats).forEach(function(cat){
      lines.push(cat + ' ' + res.catStats[cat].correct + '/' + res.catStats[cat].total);
    });
    return lines.join('\n');
  }
  if (type === 'friend'){
    return '关键特质：' + res.top.map(function(t){ return FRIEND_TRAITS[t].name; }).join(' · ');
  }
  return '';
}
